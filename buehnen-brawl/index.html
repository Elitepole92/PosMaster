<body>
<canvas id="game" tabindex="0" aria-label="Bühnen-Brawl Spielfeld"></canvas>
<script>
'use strict';
/* =========================================================================
   BÜHNEN-BRAWL – lokales 2-Spieler-Prügelspiel (Plattform-Fighter)
   Kämpfer: Medien Hamster, Hallenmeister, Cemil, Crew Rigger
   Steuerung pro Spieler: Laufen, Springen, Schild, Schlag, Finisher
   ========================================================================= */
const W = 1280, H = 720;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let RS = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
  RS = cv.width / W;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI, TAU = PI * 2;

/* ---------------- Gerät erkennen ---------------- */
const QS = new URLSearchParams(location.search);
// Touch-Gerät (iPhone, iPad, Android): Touch-Buttons, nur Einzelspieler, Querformat
const TOUCH = QS.has('touch') || (matchMedia('(hover: none) and (pointer: coarse)').matches && ('ontouchstart' in window || navigator.maxTouchPoints > 0));
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
const isPortrait = () => TOUCH && innerHeight > innerWidth;

/* ---------------- Eingabe ---------------- */
const held = new Set(); const pressed = new Set(); const touchHeld = new Set();
const NOSCROLL = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab']);
addEventListener('keydown', e => {
  if (NOSCROLL.has(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  held.add(e.code); audioInit();
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());
addEventListener('touchend', () => audioInit(), { passive: true });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('dblclick', e => e.preventDefault());

const CTRL = [
  { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], atk: ['KeyF'], fin: ['KeyG'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], atk: ['KeyK', 'Numpad1'], fin: ['KeyL', 'Numpad2'] }
];
const NOINPUT = { left: 0, right: 0, up: 0, down: 0, upP: 0, downP: 0, atk: 0, fin: 0 };
const isP = (i, k) => CTRL[i][k].some(c => pressed.has(c));
function readInput(i) {
  const c = CTRL[i], h = a => a.some(k => held.has(k) || touchHeld.has(k));
  return { left: h(c.left), right: h(c.right), up: h(c.up), down: h(c.down), upP: isP(i, 'up'), downP: isP(i, 'down'),
           atk: isP(i, 'atk'), fin: isP(i, 'fin') };
}

/* ---------------- Sound (WebAudio, synthetisch) ---------------- */
let AC = null, master = null;
function audioInit() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = settings.mute ? 0 : 0.7; master.connect(AC.destination);
      const b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource(); src.buffer = b; src.connect(AC.destination); src.start(0); // iOS entsperren
    }
    catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'square', vol = 0.1, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function applyMute() { if (master) master.gain.value = settings.mute ? 0 : 0.7; }
let noiseBuf = null;
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = ftype; f.frequency.value = freq; f.Q.value = ftype === 'bandpass' ? 4 : 0.7;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  jump() { tone(260, 0.12, 'square', 0.04, 320); },
  swing() { noise(0.09, 0.07, 2600, 'highpass'); },
  hit(k) { noise(0.1 + k * 0.006, 0.28, 700 + k * 60); tone(150, 0.14 + k * 0.004, 'sine', 0.35, -90); if (k > 16) tone(70, 0.4, 'sawtooth', 0.12, -40); },
  block() { tone(950, 0.07, 'triangle', 0.1, -200); },
  ko() { noise(1.0, 0.45, 500); tone(90, 0.9, 'sawtooth', 0.22, -60); tone(1400, 0.5, 'sine', 0.06, -1200); },
  ready() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.05, 0, i * 0.07)); },
  fin() { tone(220, 0.6, 'sawtooth', 0.08, 440); noise(0.5, 0.15, 3000, 'highpass'); },
  engine() { tone(70, 1.8, 'sawtooth', 0.09, 60); tone(140, 0.4, 'square', 0.04, 80); },
  beep() { tone(1050, 0.09, 'square', 0.05); },
  lighter() { noise(0.05, 0.2, 4000, 'highpass'); noise(0.3, 0.08, 900, 'bandpass', 0.06); },
  puff() { noise(0.9, 0.22, 500); },
  buzz() { tone(100, 0.5, 'sawtooth', 0.06, 20); },
  zap() { noise(0.5, 0.35, 3500, 'highpass'); tone(60, 0.5, 'sawtooth', 0.25, 30); tone(2400, 0.2, 'square', 0.05, -1800); },
  chain() { for (let i = 0; i < 5; i++) tone(rand(1800, 3200), 0.05, 'triangle', 0.05, 0, i * 0.04); },
  count() { tone(440, 0.16, 'square', 0.07); },
  go() { tone(880, 0.4, 'square', 0.07); tone(1320, 0.4, 'square', 0.04); },
  shieldBreak() { tone(1200, 0.5, 'triangle', 0.1, -1000); noise(0.3, 0.2, 2000, 'highpass'); },
  select() { tone(660, 0.06, 'square', 0.05); },
  move() { tone(520, 0.04, 'square', 0.03); },
  land() { tone(110, 0.08, 'sine', 0.14, -40); noise(0.06, 0.05, 600); },
  shield() { tone(520, 0.12, 'sine', 0.05, 260); },
  respawn() { tone(300, 0.5, 'sine', 0.06, 900); tone(600, 0.4, 'triangle', 0.03, 600, 0.1); },
  feedback() { tone(900, 0.5, 'sine', 0.07, 1500); tone(1800, 0.45, 'sine', 0.03, 1200, 0.1); },
  sonic() { noise(0.08, 0.6, 6000, 'highpass'); noise(1.4, 0.55, 220); tone(48, 1.2, 'sine', 0.6, -20); tone(95, 0.6, 'sawtooth', 0.15, -50); },
  confirm() { tone(660, 0.08, 'square', 0.06); tone(990, 0.12, 'square', 0.06, 0, 0.07); }
};

/* ---------------- Bühne ---------------- */
const STAGE = { x1: 240, x2: 1040, top: 560, bottom: 632 };
const PLATS = [
  { x1: 350, x2: 540, y: 430, kind: 'truss' },
  { x1: 740, x2: 930, y: 430, kind: 'truss' }
];
const BLAST = { x1: -150, x2: 1430, y1: -320, y2: 900 };

/* ---------------- Zeichen-Helfer ---------------- */
function E(c, x, y, rx, ry, col, rot = 0) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); c.fill(); }
function Cc(c, x, y, r, col) { E(c, x, y, r, r, col); }
function Ln(c, x1, y1, x2, y2, col, w) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function RR(c, x, y, w, h, r, col) { c.fillStyle = col; c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.fill(); }
function strokeRR(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.stroke(); }
// Text auf der Figur, der auch bei gespiegelter Figur lesbar bleibt
function txt(c, text, x, y) {
  if (c.getTransform().a < 0) { const w = c.measureText(text).width; c.save(); c.translate(x + w, y); c.scale(-1, 1); c.fillText(text, 0, 0); c.restore(); }
  else c.fillText(text, x, y);
}
function ik(ax, ay, bx, by, L1, L2, s) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 0.01;
  const maxD = L1 + L2 - 0.01;
  if (d > maxD) { bx = ax + dx / d * maxD; by = ay + dy / d * maxD; dx = bx - ax; dy = by - ay; d = maxD; }
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const mx = ax + dx * a / d, my = ay + dy * a / d;
  return { kx: mx - s * dy * h / d, ky: my + s * dx * h / d, bx, by };
}
// Warnweste auf dem Oberkörper (Koordinaten: Hüfte = 0, Schulter = -L)
function vest(c, tw, L, col, colD, label, labelCol) {
  RR(c, -tw / 2 - 1.5, -L - 3, tw + 3, L * 0.8, 5, col);
  c.fillStyle = colD; c.fillRect(-tw / 2 - 1.5, -L - 1, 5, L * 0.78 - 2);
  for (const y of [-L * 0.55, -L * 0.36]) { RR(c, -tw / 2 - 1.5, y, tw + 3, 4, 1, '#e9eef2'); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fillRect(-tw / 2 - 1.5, y + 0.5, tw + 3, 1); }
  if (label) { c.fillStyle = labelCol; c.font = 'bold 5.5px sans-serif'; txt(c, label, -tw / 2 + 1, -L * 0.66); }
}

/* ---------------- Kämpfer ---------------- */
// Generische Figur mit IK-Armen/-Beinen; S = Stil des Charakters
function drawHuman(c, f, A, S) {
  A = A || animInfo(f);
  const t = f.t || 0, hz = S.hunch || 0;
  const AL = S.upper + S.fore, LL = S.thigh + S.shin, k = LL / 58;
  const HIP = { x: 0, y: S.hip }, SH = { x: hz, y: S.sh };
  const restY = S.sh + AL * 0.88;
  const P = { rot: 0, bob: 0, fF: { x: 6 * k, y: 0 }, fB: { x: -6 * k, y: 0 }, hF: { x: 8 + hz, y: restY }, hB: { x: -4 + hz, y: restY }, eyes: 'open', prop: null, A, t };
  switch (A.kind) {
    case 'idle': P.bob = Math.sin(t * 0.08) * 1.2; P.hF.y += P.bob; P.hB.y += P.bob; break;
    case 'run': {
      const s = Math.sin(t * 0.34), co = Math.cos(t * 0.34);
      P.fF = { x: 15 * k * s, y: -Math.max(0, co) * 9 * k }; P.fB = { x: -15 * k * s, y: -Math.max(0, -co) * 9 * k };
      P.hF = { x: hz - 12 * s * k + 4, y: S.sh + AL * 0.72 }; P.hB = { x: hz + 12 * s * k, y: S.sh + AL * 0.72 }; P.rot = 0.1; break;
    }
    case 'air': P.fF = { x: 12 * k, y: -16 * k }; P.fB = { x: -8 * k, y: -6 * k }; P.hF = { x: hz + AL * 0.4, y: S.sh - AL * 0.15 }; P.hB = { x: hz - AL * 0.42, y: S.sh - AL * 0.1 }; break;
    case 'shield': P.fF = { x: 12 * k, y: 0 }; P.fB = { x: -12 * k, y: 0 }; P.hF = { x: hz + AL * 0.55, y: S.sh + 6 }; P.hB = { x: hz + AL * 0.45, y: S.sh + 14 }; P.bob = 3; break;
    case 'hurt': P.rot = f.rot || 0.3; P.fF = { x: 16 * k, y: -10 * k }; P.fB = { x: -10 * k, y: -2 }; P.hF = { x: hz - 14, y: S.sh - AL * 0.8 }; P.hB = { x: hz + 18, y: S.sh - AL * 0.75 }; P.eyes = 'x'; break;
    case 'drive': P.fF = { x: 24 * k, y: S.hip + 6 }; P.fB = { x: 20 * k, y: S.hip + 8 }; P.hF = { x: hz + AL * 0.8, y: S.sh + AL * 0.35 }; P.hB = { x: hz + AL * 0.7, y: S.sh + AL * 0.42 }; break;
    case 'atk': {
      const e = A.e;
      P.hF = { x: hz + lerp(8, AL * 0.98, e), y: lerp(restY, S.sh + 4, e) }; P.hB = { x: hz - 14, y: S.sh + AL * 0.6 };
      P.fF = { x: 14 * k, y: 0 }; P.fB = { x: -10 * k, y: 0 }; P.rot = 0.08 * e;
      if (S.atkPose) S.atkPose(P, e, A); break;
    }
    case 'fin': if (S.finPose) S.finPose(P, A, f); break;
  }
  c.save();
  c.translate(0, P.bob * 0.5);
  c.translate(HIP.x, HIP.y); c.rotate(P.rot); c.translate(-HIP.x, -HIP.y);
  const leg = (foot, shade, front) => {
    const q = ik(HIP.x, HIP.y, foot.x, foot.y, S.thigh, S.shin, -1);
    Ln(c, HIP.x, HIP.y, q.kx, q.ky, shade, S.legW);
    if (S.shinCol) {   // kurze Hose: nacktes Bein + hoher Stiefel + Cargotasche
      Ln(c, q.kx, q.ky, q.bx, q.by, front ? S.shinCol : S.shinColD, S.legW * 0.62);
      Ln(c, lerp(q.bx, q.kx, 0.42), lerp(q.by, q.ky, 0.42), q.bx, q.by, S.boot, S.legW * 0.9);
      const mx = lerp(HIP.x, q.kx, 0.55), my = lerp(HIP.y, q.ky, 0.55);
      RR(c, mx - 3, my - 4, 8, 9, 2, front ? S.pocket : S.pantsD);
    } else Ln(c, q.kx, q.ky, q.bx, q.by, shade, S.legW * 0.92);
    const a = Math.atan2(q.by - q.ky, q.bx - q.kx), bl = S.bootL;
    c.save(); c.translate(q.bx, q.by); c.rotate(a - PI / 2);
    RR(c, -bl * 0.32, -bl * 0.36, bl, bl * 0.48, 4, S.boot); RR(c, -bl * 0.32, bl * 0.06, bl, 3.2, 1.5, '#55555c');
    c.restore();
  };
  const arm = (hand, shade) => {
    const q = ik(SH.x, SH.y, hand.x, hand.y, S.upper, S.fore, 1);
    Ln(c, SH.x, SH.y, q.kx, q.ky, shade, S.armW); Ln(c, q.kx, q.ky, q.bx, q.by, shade, S.armW * 0.9);
    Cc(c, q.bx, q.by, S.handR, S.hand); return q;
  };
  leg(P.fB, S.pantsD, false);
  P.qB = arm(P.hB, S.sleeveD);
  const vx = SH.x - HIP.x, vy = SH.y - HIP.y, L = Math.hypot(vx, vy);
  c.save(); c.translate(HIP.x, HIP.y); c.rotate(Math.atan2(vy, vx) + PI / 2);
  RR(c, -S.torsoW / 2, -L - 5, S.torsoW, L + 9, S.torsoW * 0.3, S.shirt);
  if (S.torsoDeco) S.torsoDeco(c, S.torsoW, L, f, A);
  c.restore();
  S.head(c, SH.x + S.headOff.x, SH.y + S.headOff.y, f, A, P);
  leg(P.fF, S.pants, true);
  if (S.hipFront) S.hipFront(c, f, A, P);
  const q = arm(P.hF, S.sleeve);
  if (S.prop) S.prop(c, q, f, A, P);
  c.restore();
}

/* ---- Medien Hamster: pummelig, lila Warnweste, schwarzer Helm ---- */
function drawHamster(c, f, A) {
  A = A || animInfo(f);
  const t = f.t || 0;
  const fur = '#e39a4b', furD = '#b8692a', belly = '#fde9cc', pink = '#f4a0b5';
  let rot = 0, bx = -10, by = 0, fx = 10, fy = 0, ax = 15, ay = -24, cheek = 1, eyeClosed = false, bodyY = 0, cig = false, puffing = false;
  switch (A.kind) {
    case 'idle': bodyY = Math.sin(t * 0.12) * 1.3; break;
    case 'run': {
      const s = Math.sin(t * 0.45), co = Math.cos(t * 0.45);
      fx = 10 + s * 9; fy = -Math.max(0, co) * 7; bx = -10 - s * 9; by = -Math.max(0, -co) * 7; rot = 0.12; bodyY = -Math.abs(s) * 2;
      ax = 17 + s * 4; ay = -30; break;
    }
    case 'air': fx = 9; fy = -9; bx = -9; by = -5; ax = 18; ay = -44; rot = A.vy < 0 ? -0.08 : 0.08; break;
    case 'shield': ax = 22; ay = -40; cheek = 1.15; break;
    case 'hurt': rot = f.rot || -0.35; fx = 16; fy = -12; bx = -14; by = -4; eyeClosed = true; cheek = 1.25; ax = -6; ay = -54; break;
    case 'drive': fx = 18; fy = -6; bx = 12; by = -4; ax = 24; ay = -36; break;
    case 'atk': { const e = A.e; rot = 0.22 * e; ax = lerp(15, 34, e); ay = lerp(-24, -40, e); fx = 14; bx = -12; cheek = 1 + 0.15 * e; break; }
    case 'fin': {
      cig = true;
      if (A.t < 22) { ax = 27; ay = -40; }
      else { puffing = true; cheek = A.t < 40 ? 1.55 : 1.2; ax = 14; ay = -26; rot = 0.12; }
      break;
    }
  }
  c.save();
  c.translate(0, bodyY);
  c.translate(0, -36); c.rotate(rot); c.translate(0, 36);
  const leg = (hx, hy, x, y) => { Ln(c, hx, hy, x, y - 3, furD, 11); E(c, x + 3, y - 2, 8, 4.8, pink); };
  leg(-7, -14, bx, by);
  E(c, -23, -22, 6, 4, furD);
  Cc(c, -11, -58, 7, fur); Cc(c, -11, -58, 3.8, pink);
  E(c, 0, -36, 24, 34, fur);
  // lila Warnweste mit Reflektoren
  c.save(); c.beginPath(); c.ellipse(0, -36, 24, 34, 0, 0, TAU); c.clip();
  c.fillStyle = '#8e44ff'; c.fillRect(-34, -52, 68, 40);
  c.fillStyle = '#6a2fd0'; c.fillRect(-34, -52, 12, 40);
  for (const y of [-40, -28]) { c.fillStyle = '#e9eef2'; c.fillRect(-34, y, 68, 4.5); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fillRect(-34, y + 0.6, 68, 1); }
  c.restore();
  E(c, 8, -29, 11, 18, belly);
  c.fillStyle = '#e8dcff'; c.font = 'bold 5px sans-serif'; txt(c, 'MEDIEN', -22, -43);
  // schwarzer Helm
  c.fillStyle = '#151517'; c.beginPath(); c.ellipse(2, -58, 20, 14, 0, PI, TAU); c.fill();
  RR(c, -19, -60, 46, 5, 2.5, '#0b0b0d');
  c.strokeStyle = 'rgba(255,255,255,0.28)'; c.lineWidth = 2; c.beginPath(); c.ellipse(2, -58, 17, 9, 0, PI * 1.15, PI * 1.55); c.stroke();
  // Gesicht
  if (eyeClosed) { Ln(c, 11, -50, 19, -48, '#111', 2.4); Ln(c, 11, -46, 19, -48, '#111', 2.4); }
  else { Cc(c, 15, -49, 4.4, '#111'); Cc(c, 16.5, -50.5, 1.6, '#fff'); }
  E(c, 18, -37, 10 * cheek, 8 * cheek, '#f7c48e');
  E(c, 19, -38, 4, 2.5, 'rgba(255,120,140,0.35)');
  Cc(c, 28, -43, 3, pink);
  RR(c, 23, -39, 4, 5, 1, '#fff');
  c.strokeStyle = 'rgba(60,30,10,0.6)'; c.lineWidth = 1;
  for (const [x2, y2] of [[39, -46], [40, -41], [38, -37]]) { c.beginPath(); c.moveTo(26, -41); c.lineTo(x2, y2); c.stroke(); }

function popText(x, y, text, col = '#fff', size = 34, life = 40) { texts.push({ x, y, text, col, size, t: 0, life }); }
function stepFx() {

/* ---------------- Physik & Logik ---------------- */
function hurtbox(o) { return { x: o.x - o.def.w / 2, y: o.y - o.def.h, w: o.def.w, h: o.def.h }; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function worldBox(f, b) { return { x: f.facing > 0 ? f.x + b.x : f.x - b.x - b.w, y: f.y + b.y, w: b.w, h: b.h }; }
function hittable(o) { return !o.dead && o.invuln <= 0 && o.plat <= 0; }

function addMeter(f, v) {
  const before = f.meter; f.meter = Math.min(100, f.meter + v);
  if (before < 100 && f.meter >= 100) { sfx.ready(); popText(f.x, f.y - f.def.h - 40, 'FINISHER BEREIT!', f.def.color, 26, 70); }
}
function applyHit(att, o, m, dirX, hx, hy) {
  if (o.shielding) {
    o.shield -= m.dmg * 1.8; o.vx = dirX * (2 + m.kb * 0.45);
    freeze = 4; sfx.block(); sparks(hx, hy, '#7fd3ff', 6);
    addMeter(att, (m.meter || 0) * 0.35);
    if (o.shield <= 0) breakShield(o);
    return;
  }
  o.damage = Math.min(999, o.damage + m.dmg); o.dmgShake = 14; o.flash = 8;
  att.stats.dealt += m.dmg; att.stats.hits++;
  addMeter(att, m.meter || 0);
  if (o.armor) { freeze = 5; sparks(hx, hy, '#fff', 8); sfx.hit(4); popText(o.x, o.y - o.def.h - 10, 'UNBEEINDRUCKT', '#9ef', 16, 26); return; }
  const kb = (m.kb + o.damage * m.scale) * o.def.weight, a = m.ang * PI / 180;
  o.vx = Math.cos(a) * kb * dirX; o.vy = -Math.sin(a) * kb;
  o.onGround = false; o.ground = null; o.y -= 1; o.fast = false;
  o.hitstun = Math.floor(kb * 2.3) + 8; o.atk = null; o.lag = 0; o.shielding = false; o.buf = null;
  if (o.fin) { o.fin = null; o.armor = false; }
  o.jumps = Math.max(o.jumps, 1);
  o.tumble = kb > 13 ? 0.28 * dirX : 0; o.rot = 0;
  freeze = Math.min(18, Math.floor(3 + m.dmg * 0.45 + kb * 0.15));
  shake = Math.max(shake, Math.min(24, kb * 0.6));
  sparks(hx, hy, att.def.hitColor, 8 + Math.floor(kb));
  if (m.meter && kb > 8) popText(hx, hy - 20, pick(['POW!', 'BÄM!', 'KRACH!', 'ZACK!', 'WUMMS!', 'BONK!']), att.def.hitColor, 22 + Math.min(30, kb * 1.4), 36);
  if (kb > 19) { flashScreen = 6; flashCol = '255,255,255'; if (m.meter) popText(o.x, o.y - o.def.h - 30, 'SMASH!', '#fff', 46, 40); }
  sfx.hit(kb);
}
function breakShield(o) {
  o.shield = 0; o.shielding = false; o.broken = 150; o.vy = -9; o.onGround = false; o.ground = null;
  popText(o.x, o.y - o.def.h - 20, 'SCHILD KAPUTT!', '#7fd3ff', 28, 60); sfx.shieldBreak(); sparks(o.x, o.y - o.def.h / 2, '#7fd3ff', 20);
}

function startFinisher(f, o) {
  f.meter = 0; f.stats.fins++; f.atk = null; f.shielding = false; f.buf = null;
  if (!o.dead) f.facing = Math.sign(o.x - f.x) || f.facing;
  cutin = { f, t: 0, dur: 62 }; sfx.fin();
  f.fin = { type: f.def.fin, t: 0, dir: f.facing, hit: false, spin: 0, fork: 0 };

}
function finisherHit(f, o, hx, hy, text, col) {
  popText(o.x, o.y - o.def.h - 30, text, col, 40, 50);
  applyHit(f, o, FMOVE[f.def.fin], f.fin ? f.fin.dir : f.facing, hx, hy);
}
function stepFinisher(f, inp, o) {
  const Fn = f.fin; Fn.t++;
  if (Fn.type === 'forklift') {
    f.invuln = Math.max(f.invuln, 2);
    Fn.spin += (Fn.t < 20 ? 0.05 : 0.45) * Fn.dir;

    if (Fn.t < 20) {
      f.vx *= 0.8; if (!f.onGround) f.vy *= 0.85;
      if (Fn.t % 4 === 0) parts.push({ x: f.x - Fn.dir * 70, y: f.y - 40, vx: -Fn.dir * 1.5, vy: -1.2, life: 26, max: 26, col: 'rgba(90,90,100,', size: 6, g: -0.02, kind: 'smoke' });
    } else {

      if (Fn.t % 14 === 0) sfx.beep();
      if (f.onGround && Fn.t % 3 === 0) dust(f.x - Fn.dir * 40, f.y, 2, 'rgba(255,200,80,');
      if (f.onGround && f.ground) {
        const g = f.ground, m = g === STAGE ? 70 : 40;
        if ((f.x > g.x2 - m && Fn.dir > 0) || (f.x < g.x1 + m && Fn.dir < 0)) { Fn.dir *= -1; f.vx = 0; shake = Math.max(shake, 5); sfx.block(); dust(f.x, f.y, 8); }

        if (overlap(b, hurtbox(o))) { Fn.hit = true; o.squash = 70; finisherHit(f, o, o.x, o.y - 20, 'ÜBERFAHREN!', '#ffcf4a'); Fn.t = Math.max(Fn.t, 100); }

  } else if (Fn.type === 'smoke') {
    f.armor = Fn.t < 22; f.vx *= 0.8;
    if (Fn.t === 4) sfx.lighter();
    if (Fn.t < 22 && Fn.t % 6 === 0) parts.push({ x: f.x + f.facing * 42, y: f.y - 36, vx: 0, vy: -0.8, life: 30, max: 30, col: 'rgba(210,210,205,', size: 3, g: -0.01, kind: 'smoke' });

    else { c.textAlign = 'left'; c.font = 'bold 15px system-ui,sans-serif'; c.fillStyle = '#3fa9ff'; c.fillText('CPU', x0 + 616, ly + 18); c.font = '13px system-ui,sans-serif'; c.fillStyle = '#d8d8e6'; c.fillText('sucht sich einen Gegner aus, sobald du bestätigst', x0 + 660, ly + 18); }

function drawResults() {

    ['Treffer', F[0].stats.hits, F[1].stats.hits], ['Finisher', F[0].stats.fins, F[1].stats.fins]];

  });
  btn('rematch', W / 2 - 350, 590, 220, 58, 'REVANCHE', '#ffd23f', 26);
  btn('select', W / 2 - 110, 590, 220, 58, 'KÄMPFERWAHL', '#5bc8ff', 24);

function drawTouch() {
  const c = ctx, f = F[0];
  for (const b of TBTN) {
    const on = touchHeld.has(b.code), fin = b.code === 'KeyG', ready = fin && f && f.meter >= 100;
    c.save(); c.globalAlpha = fin && !ready ? 0.4 : (on ? 0.92 : 0.55);
    c.fillStyle = ready ? f.def.color : (on ? '#ffffff' : 'rgba(30,26,48,0.95)');
    c.beginPath(); c.arc(b.x, b.y, b.r, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = 3; c.stroke();
    if (fin && f) { c.strokeStyle = f.def.color; c.lineWidth = 6; c.beginPath(); c.arc(b.x, b.y, b.r + 6, -PI / 2, -PI / 2 + TAU * f.meter / 100); c.stroke(); }
    c.fillStyle = on || ready ? '#1a1024' : '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = b.label.length > 2 ? 'bold 14px system-ui,sans-serif' : 'bold 34px system-ui,sans-serif'; c.fillText(b.label, b.x, b.y + 1);
    c.textBaseline = 'alphabetic'; c.restore();

function shareIcon(c, x, y, s) {   // iOS-Teilen-Symbol

  c.beginPath(); c.moveTo(-6, -4); c.lineTo(-10, -4); c.lineTo(-10, 14); c.lineTo(10, 14); c.lineTo(10, -4); c.lineTo(6, -4); c.stroke();
  c.beginPath(); c.moveTo(0, 6); c.lineTo(0, -14); c.moveTo(-5, -9); c.lineTo(0, -14); c.lineTo(5, -9); c.stroke(); c.restore();

function drawRotate() {

  c.save(); c.translate(W / 2, H / 2 - 60); c.rotate(-Math.min(1, (frame % 120) / 60) * PI / 2);

/* ---- Render ---- */
function render() {
  const c = ctx;
  c.setTransform(RS, 0, 0, RS, 0, 0);
  ui = [];
  if (isPortrait()) { drawRotate(); return; }
  drawBackground(frame);
  if (scene === 'title') { drawTitle(); if (a2hs) { ui = []; drawA2HS(); } return; }
  if (scene === 'select') { drawSelect(); return; }
  c.save();
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  c.translate(W / 2 + sx, H / 2 + sy); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y);
  drawStage(frame);
  for (const f of F) drawFighter(f);
  drawEnts();
  drawParts();
  c.restore();
  if (flashScreen > 0) { c.fillStyle = `rgba(${flashCol},${flashScreen / 16})`; c.fillRect(0, 0, W, H); }
  drawOffscreen();
  drawHUD();
  if (touchActive() && !cutin && !gameOverT) drawTouch();
  if ((scene === 'fight' || scene === 'countdown') && !paused && !cutin && !gameOverT) {
    c.save(); c.globalAlpha = 0.8; Cc(c, 1236, 38, 24, 'rgba(20,16,36,0.92)'); c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.arc(1236, 38, 24, 0, TAU); c.stroke();
    RR(c, 1227, 27, 6, 22, 2, '#fff'); RR(c, 1239, 27, 6, 22, 2, '#fff'); c.restore();
    ui.push({ id: 'pause', x: 1204, y: 6, w: 64, h: 64 });
  }
  if (scene === 'countdown') {
    const n = Math.ceil(countdown / 60), p = (countdown % 60) / 60;
    bigText(String(n), 330, 150 + p * 60, '#ffd23f', clamp(p * 2, 0, 1));
  }
  if (goT > 0) bigText('LOS!', 330, 170, '#ff3b6b', clamp(goT / 20, 0, 1));
  if (cutin) drawCutin();
  if (gameOverT > 0) bigText('SPIEL!', 340, 150, '#fff', clamp((130 - gameOverT) / 10, 0, 1), '#c0122f');
  if (paused) {
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0, 0, W, H);
    bigText('PAUSE', 260, 110, '#fff');
    btn('resume', W / 2 - 330, 330, 200, 60, 'WEITER', '#ffd23f', 28);
    btn('select', W / 2 - 100, 330, 200, 60, 'KÄMPFERWAHL', '#5bc8ff', 22);
    btn('menu', W / 2 + 130, 330, 200, 60, 'MENÜ', '#cfcfe0', 28);
    muteButton(W / 2, 450);
    if (!TOUCH) { c.font = 'bold 18px system-ui,sans-serif'; c.fillStyle = '#ccc'; c.textAlign = 'center'; c.fillText('ESC = weiter   ·   Q = Menü   ·   M = Ton', W / 2, 530); }
  }
  if (scene === 'results') drawResults();
}

/* ---- Loop (feste 60 Schritte/s) ---- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.focus();
// Für automatisierte Tests
window.__brawl = { get F() { return F; }, get scene() { return scene; }, get ui() { return ui; }, get a2hs() { return a2hs; }, sel, settings, startMatch, onUI };
