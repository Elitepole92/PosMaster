<script>
'use strict';
/* =========================================================================
   BÜHNEN-BRAWL – Medien Hamster vs. VTler
   Lokales 2-Spieler-Prügelspiel (Plattform-Fighter) für Tastatur im Browser.
   ========================================================================= */
const W = 1280, H = 720;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let RS = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
  RS = cv.width / W;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI, TAU = PI * 2;

/* ---------------- Eingabe ---------------- */
const held = new Set(); const pressed = new Set();
const NOSCROLL = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab']);
addEventListener('keydown', e => {
  if (NOSCROLL.has(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  held.add(e.code); audioInit();
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());
addEventListener('pointerdown', () => { audioInit(); cv.focus(); });

const CTRL = [
  { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], k1: ['KeyF'], k2: ['KeyG'], k3: ['KeyH'], fin: ['KeyT'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'],
    k1: ['KeyJ', 'Numpad1'], k2: ['KeyK', 'Numpad2'], k3: ['KeyL', 'Numpad3'], fin: ['KeyI', 'Numpad0'] }
];
const NOINPUT = { left: 0, right: 0, up: 0, down: 0, upP: 0, downP: 0, k1: 0, k2: 0, k3: 0, fin: 0 };
function readInput(i) {
  const c = CTRL[i], h = a => a.some(k => held.has(k)), p = a => a.some(k => pressed.has(k));
  return { left: h(c.left), right: h(c.right), up: h(c.up), down: h(c.down), upP: p(c.up), downP: p(c.down),
           k1: p(c.k1), k2: p(c.k2), k3: p(c.k3), fin: p(c.fin) };
}

/* ---------------- Sound (WebAudio, alles synthetisch) ---------------- */
let AC = null, master = null;
function audioInit() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.7; master.connect(AC.destination); }
    catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'square', vol = 0.1, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = ftype; f.frequency.value = freq; f.Q.value = ftype === 'bandpass' ? 4 : 0.7;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  jump() { tone(260, 0.12, 'square', 0.04, 320); },
  swing() { noise(0.09, 0.07, 2600, 'highpass'); },
  hit(k) { noise(0.1 + k * 0.006, 0.28, 700 + k * 60); tone(150, 0.14 + k * 0.004, 'sine', 0.35, -90); if (k > 16) tone(70, 0.4, 'sawtooth', 0.12, -40); },
  block() { tone(950, 0.07, 'triangle', 0.1, -200); },
  ko() { noise(1.0, 0.45, 500); tone(90, 0.9, 'sawtooth', 0.22, -60); tone(1400, 0.5, 'sine', 0.06, -1200); },
  ready() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.05, 0, i * 0.07)); },
  fin() { tone(220, 0.6, 'sawtooth', 0.08, 440); noise(0.5, 0.15, 3000, 'highpass'); },
  radio() { noise(0.45, 0.14, 1700, 'bandpass'); tone(1250, 0.07, 'sine', 0.07); tone(1250, 0.07, 'sine', 0.07, 0, 0.12); },
  wheel() { tone(90, 1.6, 'sawtooth', 0.07, 160); },
  boom() { noise(0.7, 0.5, 300); tone(55, 0.7, 'sine', 0.5, -25); },
  count() { tone(440, 0.16, 'square', 0.07); },
  go() { tone(880, 0.4, 'square', 0.07); tone(1320, 0.4, 'square', 0.04); },
  shieldBreak() { tone(1200, 0.5, 'triangle', 0.1, -1000); noise(0.3, 0.2, 2000, 'highpass'); },
  select() { tone(660, 0.06, 'square', 0.05); }
};

/* ---------------- Bühne ---------------- */
const STAGE = { x1: 240, x2: 1040, top: 560, bottom: 632 };
const PLATS = [
  { x1: 350, x2: 540, y: 430, kind: 'truss' },
  { x1: 740, x2: 930, y: 430, kind: 'truss' },
  { x1: 556, x2: 724, y: 300, kind: 'case' }
];
const BLAST = { x1: -150, x2: 1430, y1: -320, y2: 900 };

/* ---------------- Kämpfer-Definitionen ---------------- */
// Hitboxen relativ zu den Füßen, Blickrichtung rechts (y negativ = nach oben)
const HAMSTER = {
  id: 'hamster', name: 'MEDIEN HAMSTER', short: 'Hamster', w: 54, h: 70,
  speed: 6.4, airSpeed: 5.4, airAcc: 0.7, jump: 14.2, airJump: 12.6, airJumps: 2, grav: 0.64, maxFall: 11, fastFall: 17,
  weight: 1.12, color: '#ff9a3c', color2: '#ffd08a', hitColor: '#ffcf4a',
  moves: {
    k1: { id: 'k1', name: 'Backen-Jab-Kick', s: 3, a: 4, r: 9, dmg: 4, kb: 3.6, scale: 0.05, ang: 35, meter: 14, lunge: 2,
          box: [{ x: 10, y: -36, w: 42, h: 26 }] },
    k2: { id: 'k2', name: 'HDMI-Drehkick', s: 7, a: 10, r: 14, dmg: 8, kb: 5.6, scale: 0.10, ang: 50, meter: 20, spin: true,
          box: [{ x: -48, y: -58, w: 96, h: 54 }] },
    k3: { id: 'k3', name: 'Laufrad-Dropkick', s: 10, a: 10, r: 20, dmg: 13, kb: 7, scale: 0.15, ang: 30, meter: 26, lunge: 11, hop: -5,
          box: [{ x: 14, y: -44, w: 48, h: 36 }] }
  },
  finName: 'MEGA-HAMSTERRAD', finQuote: 'Backen voll – jetzt wird gerollt!',
  quotes: ['Quiek! Mampf!', 'Das kommt in die Story!', 'Hamsterbacken > Gaffa!', 'Content gesichert! 📸', 'Abgeschnitten wie ein schlechter Take!'],
  draw: (c, f, A) => drawHamster(c, f, A)
};
const VTLER = {
  id: 'vt', name: 'VTLER', short: 'VTler', w: 50, h: 120,
  speed: 5.3, airSpeed: 4.6, airAcc: 0.55, jump: 13.6, airJump: 12, airJumps: 2, grav: 0.68, maxFall: 12, fastFall: 18,
  weight: 0.9, color: '#d8f72a', color2: '#f2ff9a', hitColor: '#e9ff5c',
  moves: {
    k1: { id: 'k1', name: 'Stahlkappen-Kick', s: 5, a: 4, r: 11, dmg: 5, kb: 4, scale: 0.055, ang: 30, meter: 14, lunge: 1.5,
          box: [{ x: 12, y: -52, w: 54, h: 28 }] },
    k2: { id: 'k2', name: 'Gaffa-Roundhouse', s: 9, a: 7, r: 16, dmg: 10, kb: 6, scale: 0.11, ang: 55, meter: 20,
          box: [{ x: 4, y: -112, w: 68, h: 58 }] },
    k3: { id: 'k3', name: 'Flightcase-Dropkick', s: 12, a: 10, r: 22, dmg: 14, kb: 7.4, scale: 0.15, ang: 28, meter: 26, lunge: 10, hop: -6,
          box: [{ x: 14, y: -72, w: 56, h: 46 }] }
  },
  finName: 'FUNKSPRUCH: TRAVERSE AB!', finQuote: 'Kanal 1 für Rigging – Traverse runter, JETZT!',
  quotes: ['Stand nicht im Rider!', 'Kabel ist Kabel.', 'Feierabend erst nach Abbau!', 'Over and out. 📻', 'Das gaffen wir fest.'],
  draw: (c, f, A) => drawVT(c, f, A)
};
const WHEEL_R = 58;
const WHEEL_MOVE = { dmg: 24, kb: 12, scale: 0.21, ang: 38, meter: 0 };
const TRUSS_MOVE = { dmg: 26, kb: 11, scale: 0.21, ang: 52, meter: 0 };
const SHOCK_MOVE = { dmg: 12, kb: 8, scale: 0.14, ang: 62, meter: 0 };

/* ---------------- Spielzustand ---------------- */
const settings = { stocks: 3, cpu: false };
let scene = 'title', frame = 0, F = [], parts = [], texts = [], ents = [], koFx = [];
let freeze = 0, shake = 0, cutin = null, countdown = 0, goT = 0, gameOverT = 0, paused = false, winner = null, flashScreen = 0;
const cam = { x: 640, y: 400, z: 1 };

function makeFighter(def, idx, x) {
  return {
    def, idx, x, y: STAGE.top, vx: 0, vy: 0, facing: idx === 0 ? 1 : -1, onGround: true, ground: STAGE, jumps: def.airJumps,
    damage: 0, stocks: settings.stocks, meter: 0, atk: null, atkT: 0, hitDone: false, hitstun: 0, tumble: 0, rot: 0,
    invuln: 0, shield: 100, shielding: false, broken: 0, fast: false, drop: 0, buf: null, fin: null, armor: false, lag: 0,
    dead: false, respawnT: 0, plat: 0, t: 0, flash: 0, dmgShake: 0, quote: null, readyT: 0,
    stats: { dealt: 0, kos: 0, fins: 0, hits: 0 }, ai: { t: 0, mx: 0, hold: 0, shieldT: 0 }
  };
}
function startMatch() {
  F = [makeFighter(HAMSTER, 0, 450), makeFighter(VTLER, 1, 830)];
  parts = []; texts = []; ents = []; koFx = [];
  freeze = 0; shake = 0; cutin = null; gameOverT = 0; paused = false; winner = null; goT = 0; flashScreen = 0;
  cam.x = 640; cam.y = 420; cam.z = 1;
  scene = 'countdown'; countdown = 180;
}

/* ---------------- Partikel & Effekte ---------------- */
function sparks(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(2, 9);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(14, 26), max: 26, col, size: rand(2, 5), g: 0.15, kind: 'spark' });
  }
  parts.push({ x, y, vx: 0, vy: 0, life: 14, max: 14, col: '#fff', size: 10, g: 0, kind: 'ring' });
}
function dust(x, y, n, col = 'rgba(200,200,215,') {
  for (let i = 0; i < n; i++)
    parts.push({ x: x + rand(-10, 10), y: y - 2, vx: rand(-2.5, 2.5), vy: rand(-1.6, -0.2), life: rand(18, 30), max: 30, col, size: rand(4, 9), g: -0.02, kind: 'smoke' });
}
function popText(x, y, text, col = '#fff', size = 34, life = 40) { texts.push({ x, y, text, col, size, t: 0, life }); }
function stepFx() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.96; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.t++; t.y -= 0.6; }
  texts = texts.filter(t => t.t < t.life);
  for (const k of koFx) k.t++;
  koFx = koFx.filter(k => k.t < 70);
  shake *= 0.88; if (shake < 0.3) shake = 0;
  if (flashScreen > 0) flashScreen--;
}

/* ---------------- Physik & Logik ---------------- */
function hurtbox(o) { return { x: o.x - o.def.w / 2, y: o.y - o.def.h, w: o.def.w, h: o.def.h }; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function worldBoxes(f, m) {
  return m.box.map(b => ({ x: f.facing > 0 ? f.x + b.x : f.x - b.x - b.w, y: f.y + b.y, w: b.w, h: b.h }));
}
function hittable(o) { return !o.dead && o.invuln <= 0 && o.plat <= 0; }

function addMeter(f, v) {
  const before = f.meter; f.meter = Math.min(100, f.meter + v);
  if (before < 100 && f.meter >= 100) {
    f.readyT = 90; sfx.ready();
    popText(f.x, f.y - f.def.h - 40, 'FINISHER BEREIT!', f.def.color, 26, 70);
  }
}

function applyHit(att, o, m, dirX, hx, hy) {
  if (o.shielding) {
    o.shield -= m.dmg * 1.8; o.vx = dirX * (2 + m.kb * 0.45);
    freeze = 4; sfx.block(); sparks(hx, hy, '#7fd3ff', 6);
    addMeter(att, (m.meter || 0) * 0.35);
    if (o.shield <= 0) breakShield(o);
    return;
  }
  o.damage = Math.min(999, o.damage + m.dmg); o.dmgShake = 14; o.flash = 8;
  att.stats.dealt += m.dmg; att.stats.hits++;
  addMeter(att, m.meter || 0);
  if (o.armor) { // Super-Armor (VTler beim Funkspruch)
    freeze = 5; sparks(hx, hy, '#fff', 8); sfx.hit(4); popText(o.x, o.y - o.def.h - 10, 'ARMOR', '#9ef', 18, 26);
    return;
  }
  const kb = (m.kb + o.damage * m.scale) * o.def.weight;
  const a = m.ang * PI / 180;
  o.vx = Math.cos(a) * kb * dirX; o.vy = -Math.sin(a) * kb;
  o.onGround = false; o.ground = null; o.y -= 1; o.fast = false;
  o.hitstun = Math.floor(kb * 2.3) + 8; o.atk = null; o.lag = 0; o.shielding = false; o.buf = null;
  if (o.fin) { o.fin = null; o.armor = false; }
  o.jumps = Math.max(o.jumps, 1);
  o.tumble = kb > 13 ? 0.28 * dirX : 0; o.rot = 0;
  freeze = Math.min(18, Math.floor(3 + m.dmg * 0.45 + kb * 0.15));
  shake = Math.max(shake, Math.min(24, kb * 0.6));
  sparks(hx, hy, att.def.hitColor, 8 + Math.floor(kb));
  if (kb > 9 || m.dmg >= 10) popText(hx, hy - 20, pick(['POW!', 'BÄM!', 'KRACH!', 'ZACK!', 'WUMMS!', 'BONK!']), att.def.hitColor, 22 + Math.min(30, kb * 1.4), 36);
  if (kb > 19) { flashScreen = 6; popText(o.x, o.y - o.def.h - 30, 'SMASH!', '#fff', 46, 40); }
  sfx.hit(kb);
}
function breakShield(o) {
  o.shield = 0; o.shielding = false; o.broken = 150; o.vy = -9; o.onGround = false; o.ground = null;
  popText(o.x, o.y - o.def.h - 20, 'SCHUTZ WEG!', '#7fd3ff', 28, 60); sfx.shieldBreak(); sparks(o.x, o.y - o.def.h / 2, '#7fd3ff', 20);
}

function startFinisher(f, o) {
  f.meter = 0; f.stats.fins++; f.atk = null; f.shielding = false; f.buf = null;
  cutin = { f, t: 0, dur: 62 };
  sfx.fin();
  if (f.def.id === 'hamster') { f.fin = { type: 'wheel', t: 0, dir: f.facing, hit: false, spin: 0 }; sfx.wheel(); }
  else f.fin = { type: 'truss', t: 0, tx: o.dead ? 640 : o.x };
}

function stepFinisher(f, inp, o) {
  const Fn = f.fin; Fn.t++;
  if (Fn.type === 'wheel') {
    f.invuln = Math.max(f.invuln, 2);
    Fn.spin += (Fn.t < 18 ? 0.18 : 0.55) * Fn.dir;
    if (Fn.t < 18) { f.vx *= 0.8; if (!f.onGround) f.vy *= 0.85; }
    else {
      f.vx = Fn.dir * 13.5;
      if (f.onGround && Fn.t % 3 === 0) dust(f.x - Fn.dir * 30, f.y, 2, 'rgba(255,180,90,');
      if (f.onGround && f.ground) {
        const g = f.ground, m = g === STAGE ? 50 : 30;
        if ((f.x > g.x2 - m && Fn.dir > 0) || (f.x < g.x1 + m && Fn.dir < 0)) {
          Fn.dir *= -1; shake = Math.max(shake, 6); sfx.block(); sparks(f.x + Fn.dir * -50, f.y - 40, '#ffb347', 8);
        }
      }
      if (!Fn.hit && hittable(o)) {
        const cx = f.x, cy = f.y - WHEEL_R, hb = hurtbox(o);
        const nx = clamp(cx, hb.x, hb.x + hb.w), ny = clamp(cy, hb.y, hb.y + hb.h);
        if ((nx - cx) ** 2 + (ny - cy) ** 2 < WHEEL_R * WHEEL_R) {
          Fn.hit = true; applyHit(f, o, WHEEL_MOVE, Fn.dir, nx, ny); Fn.t = Math.max(Fn.t, 100);
        }
      }
    }
    f.facing = Fn.dir;
    if (Fn.t >= 118) { f.fin = null; f.lag = 16; }
  } else {
    f.armor = Fn.t < 52; f.vx *= 0.8;
    if (!o.dead) Fn.tx = lerp(Fn.tx, o.x, 0.12);
    if (Fn.t === 6 || Fn.t === 30) sfx.radio();
    if (Fn.t === 52) {
      const top = cam.y - H / 2 / cam.z - 80;
      ents.push({ type: 'truss', x: Fn.tx, y: Math.min(top, -40), vy: 8, owner: f, hit: false, landed: false, t: 0 });
      tone(1600, 0.5, 'sine', 0.05, -1300);
    }
    if (Fn.t >= 72) { f.fin = null; f.armor = false; f.lag = 8; }
  }
}

function stepEnts() {
  for (const e of ents) {
    e.t++;
    const owner = e.owner, o = F[1 - owner.idx];
    if (!e.landed) {
      e.vy = Math.min(e.vy + 1.3, 32); e.y += e.vy;
      const r = { x: e.x - 115, y: e.y - 30, w: 230, h: 30 };
      if (!e.hit && hittable(o) && overlap(r, hurtbox(o))) {
        e.hit = true; applyHit(owner, o, TRUSS_MOVE, Math.sign(o.x - e.x) || owner.facing, o.x, o.y - o.def.h * 0.8);
      }
      if (e.x + 115 > STAGE.x1 && e.x - 115 < STAGE.x2 && e.y >= STAGE.top) {
        e.y = STAGE.top; e.landed = true; e.t = 0; shake = Math.max(shake, 20); sfx.boom();
        dust(e.x, STAGE.top, 26); for (let i = -1; i <= 1; i += 2) dust(e.x + i * 100, STAGE.top, 10);
        parts.push({ x: e.x, y: STAGE.top - 4, vx: 0, vy: 0, life: 24, max: 24, col: '#e9ff5c', size: 20, g: 0, kind: 'wave' });
        if (!e.hit && hittable(o) && o.onGround && Math.abs(o.x - e.x) < 230) {
          e.hit = true; applyHit(owner, o, SHOCK_MOVE, Math.sign(o.x - e.x) || 1, o.x, o.y - 20);
        }
      }
      if (e.y > BLAST.y2) e.dead = true;
    } else if (e.t > 80) e.dead = true;
  }
  ents = ents.filter(e => !e.dead);
}

function land(f, g, y) {
  if (f.vy > 7) dust(f.x, y, 5);
  f.y = y; f.vy = 0; f.onGround = true; f.ground = g; f.jumps = f.def.airJumps; f.fast = false;
  if (f.hitstun > 0) { f.hitstun = Math.min(f.hitstun, 8); f.rot = 0; f.tumble = 0; }
}
function collide(f, prevY) {
  const d = f.def, hw = d.w / 2;
  f.onGround = false; f.ground = null;
  if (f.x + hw > STAGE.x1 && f.x - hw < STAGE.x2) {
    if (f.vy >= 0 && prevY <= STAGE.top + 0.01 && f.y >= STAGE.top) land(f, STAGE, STAGE.top);
    else if (f.y > STAGE.top && f.y - d.h < STAGE.bottom) {
      if (prevY - d.h >= STAGE.bottom - 2 && f.vy < 0) { f.y = STAGE.bottom + d.h; f.vy = 0; }
      else {
        f.x = f.x < (STAGE.x1 + STAGE.x2) / 2 ? STAGE.x1 - hw : STAGE.x2 + hw;
        f.vx = f.hitstun > 0 ? -f.vx * 0.4 : 0;
      }
    }
  }
  if (!f.onGround && f.vy >= 0 && f.drop <= 0) {
    for (const p of PLATS) {
      if (f.x > p.x1 - 4 && f.x < p.x2 + 4 && prevY <= p.y + 0.01 && f.y >= p.y) { land(f, p, p.y); break; }
    }
  }
}

function control(f, inp, o) {
  const d = f.def, dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const onMain = f.onGround && f.ground === STAGE;
  if (inp.downP && f.onGround && f.ground !== STAGE) { f.onGround = false; f.ground = null; f.drop = 14; f.y += 3; }
  f.shielding = inp.down && onMain && f.shield > 5;
  if (f.shielding) {
    f.vx *= 0.7; f.shield -= 0.3;
    if (f.shield <= 0) breakShield(f);
  } else {

/* ---------------- Haupt-Step ---------------- */
function step() {
  frame++;

    if (pressed.has('Enter') || pressed.has('Space')) { sfx.go(); startMatch(); }
    for (let i = 1; i <= 5; i++) if (pressed.has('Digit' + i)) { settings.stocks = i; sfx.select(); }
    if (pressed.has('KeyC')) { settings.cpu = !settings.cpu; sfx.select(); }
  } else if (scene === 'results') {
    stepFx();
    if (pressed.has('Enter') || pressed.has('Space')) { sfx.go(); startMatch(); }
    if (pressed.has('Escape')) { scene = 'title'; sfx.select(); }
  } else {
    if (pressed.has('Escape') && scene === 'fight' && !gameOverT) { paused = !paused; sfx.select(); }
    if (paused) { if (pressed.has('KeyQ')) { paused = false; scene = 'title'; } pressed.clear(); return; }
    if (scene === 'countdown') {
      if (countdown % 60 === 0) sfx.count();
      if (--countdown <= 0) { scene = 'fight'; goT = 50; sfx.go(); }
    }
    if (goT > 0) goT--;
    if (cutin) { cutin.t++; if (cutin.t >= cutin.dur) cutin = null; stepCamera(); pressed.clear(); return; }
    if (freeze > 0) { freeze--; pressed.clear(); return; }
    const fighting = scene === 'fight' && !(gameOverT && gameOverT < 100);
    const in0 = fighting ? readInput(0) : NOINPUT;
    const in1 = fighting ? (settings.cpu ? cpuInput(F[1], F[0]) : readInput(1)) : NOINPUT;
    if (frame % 2) { stepFighter(F[0], in0, F[1]); stepFighter(F[1], in1, F[0]); }
    else { stepFighter(F[1], in1, F[0]); stepFighter(F[0], in0, F[1]); }
    stepEnts(); stepFx(); stepCamera();
    if (gameOverT > 0 && --gameOverT === 0) { scene = 'results'; }
  }
  pressed.clear();
}

    c.strokeStyle = '#fff'; c.lineWidth = 4; c.beginPath(); c.arc(0, 0, k.t * 6, 0, TAU); c.stroke();
    c.restore();
  }
}

/* ---- HUD ---- */
function dmgColor(d) {
  const t = clamp(d / 160, 0, 1);
  if (t < 0.5) return `rgb(255,${Math.round(255 - t * 2 * 80)},${Math.round(255 - t * 2 * 255)})`;
  return `rgb(${Math.round(255 - (t - 0.5) * 2 * 110)},${Math.round(175 - (t - 0.5) * 2 * 175)},0)`;
}
function drawPortrait(c, def, x, y, r, t) {
  c.save(); c.beginPath(); c.arc(x, y, r, 0, TAU);
  const g = c.createRadialGradient(x, y - r * 0.3, 2, x, y, r); g.addColorStop(0, def.color2); g.addColorStop(1, def.color);
  c.fillStyle = g; c.fill(); c.clip();
  const dummy = { t, def, onGround: true, vx: 0, vy: 0, atk: null, hitstun: 0, fin: null, shielding: false, broken: 0 };
  c.translate(x, y);
  if (def.id === 'hamster') { c.scale(1.05, 1.05); c.translate(-6, 46); }
  else { c.scale(1.45, 1.45); c.translate(-4, 114); }
  def.draw(c, dummy, { kind: 'idle' });
  c.restore();
  c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.arc(x, y, r, 0, TAU); c.stroke();
}
function drawHUD() {
  const c = ctx;
  F.forEach((f, i) => {
    const x = i === 0 ? 330 : 700, y = H - 92, w = 250;
    c.save();
    RR(c, x, y, w, 80, 14, 'rgba(8,6,16,0.72)');
    c.strokeStyle = i === 0 ? '#ff5a4a' : '#3fa9ff'; c.lineWidth = 2.5; c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, 80, 14); else c.rect(x, y, w, 80); c.stroke();
    drawPortrait(c, f.def, x + 42, y + 40, 30, frame);
    c.font = 'bold 13px system-ui,sans-serif'; c.fillStyle = '#ddd'; c.textAlign = 'left';
    c.fillText((i === 0 ? 'P1 · ' : (settings.cpu ? 'CPU · ' : 'P2 · ')) + f.def.short, x + 82, y + 18);
    // Schaden %
    const sh = f.dmgShake > 0 ? rand(-3, 3) : 0;
    c.font = `900 ${f.damage >= 100 ? 32 : 40}px Impact,"Arial Black",sans-serif`; c.lineWidth = 6; c.strokeStyle = '#000';
    const txt = f.dead && f.stocks <= 0 ? '—' : Math.floor(f.damage) + '%';
    c.strokeText(txt, x + 82 + sh, y + 58 + sh); c.fillStyle = dmgColor(f.damage); c.fillText(txt, x + 82 + sh, y + 58 + sh);
    // Leben
    for (let s = 0; s < settings.stocks; s++) {
      Cc(c, x + 192 + (s % 5) * 11, y + 14, 4.5, s < f.stocks ? f.def.color : '#3a3a44');
    }
    // Finisher-Leiste
    const bx = x + 170, by = y + 32, bw = 70, bh = 34;
    c.font = 'bold 10px system-ui,sans-serif'; c.fillStyle = '#aaa'; c.fillText('FINISHER', bx, by + 6);
    RR(c, bx, by + 12, bw, 12, 6, '#24222e');
    const full = f.meter >= 100;
    const mg = c.createLinearGradient(bx, 0, bx + bw, 0); mg.addColorStop(0, f.def.color); mg.addColorStop(1, full ? '#fff' : f.def.color2);
    if (f.meter > 0) RR(c, bx, by + 12, Math.max(10, bw * f.meter / 100), 12, 6, mg);
    if (full) {
      c.save(); c.globalAlpha = 0.5 + 0.5 * Math.sin(frame * 0.3); c.strokeStyle = '#fff'; c.lineWidth = 2;
      c.beginPath(); if (c.roundRect) c.roundRect(bx - 2, by + 10, bw + 4, 16, 8); else c.rect(bx - 2, by + 10, bw + 4, 16); c.stroke(); c.restore();
      c.fillStyle = '#fff'; c.font = 'bold 11px system-ui,sans-serif';
      c.fillText('BEREIT! [' + (i === 0 ? 'T' : (settings.cpu ? 'CPU' : 'I')) + ']', bx, by + 40);
    } else { c.fillStyle = '#888'; c.font = '10px system-ui,sans-serif'; c.fillText(Math.floor(f.meter) + '%', bx, by + 38); }
    c.restore();
  });
}
function drawOffscreen() {
  const c = ctx;
  for (const f of F) {
    if (f.dead) continue;
    const sx = (f.x - cam.x) * cam.z + W / 2, sy = (f.y - f.def.h / 2 - cam.y) * cam.z + H / 2;
    if (sx > 0 && sx < W && sy > 0 && sy < H) continue;
    const ex = clamp(sx, 46, W - 46), ey = clamp(sy, 46, H - 140);
    const a = Math.atan2(sy - ey, sx - ex);
    c.save();
    c.fillStyle = f.idx === 0 ? '#ff5a4a' : '#3fa9ff';
    c.beginPath(); c.moveTo(ex + Math.cos(a) * 44, ey + Math.sin(a) * 44);
    c.lineTo(ex + Math.cos(a + 0.5) * 30, ey + Math.sin(a + 0.5) * 30); c.lineTo(ex + Math.cos(a - 0.5) * 30, ey + Math.sin(a - 0.5) * 30); c.fill();
    drawPortrait(c, f.def, ex, ey, 28, frame);
    c.restore();
  }
}
function bigText(text, y, size, col, alpha = 1, stroke = '#000') {
  const c = ctx; c.save(); c.globalAlpha = alpha;
  c.font = `900 ${size}px Impact,"Arial Black",sans-serif`; c.textAlign = 'center';
  c.lineWidth = size / 8; c.strokeStyle = stroke; c.lineJoin = 'round'; c.strokeText(text, W / 2, y);
  c.fillStyle = col; c.fillText(text, W / 2, y); c.restore();
}
function drawCutin() {
  const c = ctx, f = cutin.f, d = f.def, t = cutin.t, dur = cutin.dur;
  const inA = clamp(t / 8, 0, 1), outA = clamp((dur - t) / 8, 0, 1), a = Math.min(inA, outA);
  c.save();
  c.fillStyle = `rgba(0,0,0,${0.55 * a})`; c.fillRect(0, 0, W, H);
  const bandY = 220, bh = 230;
  c.translate((1 - inA) * (f.idx === 0 ? -W : W), 0);
  c.save(); c.beginPath(); c.moveTo(0, bandY + 30); c.lineTo(W, bandY); c.lineTo(W, bandY + bh - 30); c.lineTo(0, bandY + bh); c.closePath(); c.clip();
  const g = c.createLinearGradient(0, 0, W, 0); g.addColorStop(0, d.color); g.addColorStop(1, '#14101f');
  c.fillStyle = g; c.fillRect(0, bandY - 10, W, bh + 20);
  c.strokeStyle = 'rgba(255,255,255,0.25)'; c.lineWidth = 3;
  for (let i = 0; i < 24; i++) { const y = bandY + (i * 37 + t * 22) % bh; c.beginPath(); c.moveTo(0, y); c.lineTo(W, y - 30); c.stroke(); }
  c.save(); c.translate(260, bandY + bh + (d.id === 'hamster' ? 40 : 150)); const sc = d.id === 'hamster' ? 3.6 : 2.6; c.scale(sc, sc);
  d.draw(c, { t: frame, def: d, onGround: true, vx: 0, vy: 0, atk: null, hitstun: 0, fin: null }, { kind: 'fin', t: 40 });
  c.restore();
  c.restore();
  c.font = '900 64px Impact,"Arial Black",sans-serif'; c.textAlign = 'left'; c.lineWidth = 8; c.strokeStyle = '#000';
  c.strokeText(d.finName, 470, bandY + 120); c.fillStyle = '#fff'; c.fillText(d.finName, 470, bandY + 120);
  c.font = 'italic bold 24px system-ui,sans-serif'; c.lineWidth = 5; c.strokeText('„' + d.finQuote + '“', 474, bandY + 162);
  c.fillStyle = d.color2; c.fillText('„' + d.finQuote + '“', 474, bandY + 162);
  c.restore();
}

/* ---- Titelbild ---- */
function keyCap(c, x, y, label, w = 34) {
  RR(c, x, y, w, 30, 6, '#f0f0f4'); RR(c, x, y + 24, w, 6, 4, '#b4b4c0');
  c.fillStyle = '#16141f'; c.font = 'bold 14px system-ui,sans-serif'; c.textAlign = 'center'; c.fillText(label, x + w / 2, y + 20);
  return x + w + 6;
}
function controlCard(x, y, def, i) {
  const c = ctx, col = i === 0 ? '#ff5a4a' : '#3fa9ff';
  RR(c, x, y, 540, 196, 16, 'rgba(10,8,20,0.82)');
  c.strokeStyle = col; c.lineWidth = 3; c.beginPath(); if (c.roundRect) c.roundRect(x, y, 540, 196, 16); else c.rect(x, y, 540, 196); c.stroke();
  c.textAlign = 'left'; c.fillStyle = col; c.font = '900 22px Impact,"Arial Black",sans-serif';
  c.fillText((i === 0 ? 'P1 · ' : (settings.cpu ? 'CPU · ' : 'P2 · ')) + def.name, x + 18, y + 32);
  const m = def.moves, row = (yy, keys, label) => {
    let xx = x + 18; for (const k of keys) xx = keyCap(c, xx, yy, k, k.length > 2 ? 56 : 34);
    c.textAlign = 'left'; c.fillStyle = '#e8e8f0'; c.font = '15px system-ui,sans-serif'; c.fillText(label, x + 150, yy + 20);
  };
  if (i === 0) {
    row(y + 46, ['A', 'D'], 'laufen · W springen (2× Luftsprung)');
    row(y + 82, ['S'], 'Schutz · in der Luft: Fastfall');
    row(y + 118, ['F', 'G', 'H'], `${m.k1.name} · ${m.k2.name} · ${m.k3.name}`);
    row(y + 154, ['T'], 'FINISHER: ' + def.finName);
  } else {
    row(y + 46, ['←', '→'], 'laufen · ↑ springen (2× Luftsprung)');
    row(y + 82, ['↓'], 'Schutz · in der Luft: Fastfall');
    row(y + 118, ['J', 'K', 'L'], `${m.k1.name} · ${m.k2.name} · ${m.k3.name}`);
    row(y + 154, ['I'], 'FINISHER: ' + def.finName);
  }
}
function drawTitle() {
  const c = ctx;
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(0, 0, W, H);
  // Kämpfer
  const ham = { t: frame, def: HAMSTER, onGround: true, vx: 0, vy: 0, atk: null, hitstun: 0, fin: null };
  const vt = { t: frame, def: VTLER, onGround: true, vx: 0, vy: 0, atk: null, hitstun: 0, fin: null };
  c.save(); c.translate(330, 420); c.scale(2.6, 2.6); E(c, 0, 2, 34, 6, 'rgba(0,0,0,0.5)'); HAMSTER.draw(c, ham, { kind: 'idle' }); c.restore();
  c.save(); c.translate(950, 420); c.scale(-1.7, 1.7); E(c, 0, 2, 30, 6, 'rgba(0,0,0,0.5)'); VTLER.draw(c, vt, { kind: 'idle' }); c.restore();
  // Titel
  const wob = Math.sin(frame * 0.05) * 3;
  bigText('BÜHNEN-BRAWL', 112 + wob, 96, '#ffd23f', 1, '#2a0d3d');
  c.save(); c.font = '900 34px Impact,"Arial Black",sans-serif'; c.textAlign = 'center';
  c.lineWidth = 6; c.strokeStyle = '#000';
  c.strokeText('MEDIEN HAMSTER', 330, 186); c.fillStyle = HAMSTER.color; c.fillText('MEDIEN HAMSTER', 330, 186);
  c.strokeText('VTLER', 950, 186); c.fillStyle = VTLER.color; c.fillText('VTLER', 950, 186);
  c.restore();
  const vs = 1 + Math.sin(frame * 0.15) * 0.06;
  c.save(); c.translate(W / 2, 300); c.scale(vs, vs); c.font = '900 110px Impact,"Arial Black",sans-serif'; c.textAlign = 'center';
  c.lineWidth = 12; c.strokeStyle = '#000'; c.strokeText('VS', 0, 0); c.fillStyle = '#ff3b6b'; c.fillText('VS', 0, 0); c.restore();
  controlCard(90, 438, HAMSTER, 0); controlCard(650, 438, VTLER, 1);
  // Optionen
  c.textAlign = 'center'; c.font = 'bold 17px system-ui,sans-serif'; c.fillStyle = '#cfcfe0';
  c.fillText(`[1–5] Leben: ${settings.stocks}   ·   [C] Gegner: ${settings.cpu ? 'CPU' : 'Mensch'}`, W / 2, 360);
  const blink = Math.floor(frame / 30) % 2 === 0;
  if (blink) bigText('ENTER / LEERTASTE = KAMPF!', 405, 30, '#fff');
  c.font = '13px system-ui,sans-serif'; c.fillStyle = '#8f8fa6';
  c.fillText('Treffer laden die Finisher-Leiste. Je höher die %, desto weiter fliegt man – raus aus dem Bild = Leben weg. ESC = Pause.', W / 2, 660);
  c.fillText('P2 geht auch mit Numpad 1/2/3/0.  Tipp: Manche Laptop-Tastaturen schlucken Tasten, wenn zu viele gleichzeitig gedrückt werden.', W / 2, 680);
}
function drawResults() {
  const c = ctx;
  c.fillStyle = 'rgba(4,3,10,0.78)'; c.fillRect(0, 0, W, H);
  const w = winner || F[0], d = w.def;
  bigText((w.idx === 0 ? 'P1' : (settings.cpu ? 'CPU' : 'P2')) + ' · ' + d.name + ' GEWINNT!', 110, 64, d.color);
  c.save(); c.translate(380, 520);
  const sc = d.id === 'hamster' ? 3.4 : 2.2; c.scale(sc, sc);
  E(c, 0, 2, 32, 6, 'rgba(0,0,0,0.5)');
  const jump = Math.abs(Math.sin(frame * 0.12)) * 12;
  c.translate(0, -jump);
  d.draw(c, { t: frame, def: d, onGround: false, vx: 0, vy: -1, atk: null, hitstun: 0, fin: null }, { kind: 'air', vy: -1 });
  c.restore();
  if (!w._q) w._q = pick(d.quotes);
  speech(c, 380, 220, w._q);
  // Statistik
  const x0 = 620, y0 = 200;
  c.textAlign = 'left';
  const rows = [['', 'P1 Hamster', settings.cpu ? 'CPU VTler' : 'P2 VTler'], ['KOs', F[0].stats.kos, F[1].stats.kos], ['Schaden ausgeteilt', F[0].stats.dealt + '%', F[1].stats.dealt + '%'],
    ['Treffer', F[0].stats.hits, F[1].stats.hits], ['Finisher', F[0].stats.fins, F[1].stats.fins]];
  rows.forEach((r, i) => {
    const y = y0 + i * 48;
    c.font = i === 0 ? 'bold 18px system-ui,sans-serif' : '20px system-ui,sans-serif';
    c.fillStyle = '#bdbdd0'; c.fillText(r[0], x0, y);
    c.textAlign = 'center';
    c.fillStyle = i === 0 ? '#ff5a4a' : '#fff'; c.fillText(r[1], x0 + 330, y);
    c.fillStyle = i === 0 ? '#3fa9ff' : '#fff'; c.fillText(r[2], x0 + 490, y);
    c.textAlign = 'left';
  });
  if (Math.floor(frame / 30) % 2 === 0) bigText('ENTER = REVANCHE  ·  ESC = TITEL', 640, 30, '#fff');
}

/* ---- Render ---- */
function render() {
  const c = ctx;
  c.setTransform(RS, 0, 0, RS, 0, 0);
  drawBackground(frame);
  if (scene === 'title') { drawTitle(); return; }
  c.save();
  const sx = shake ? rand(-shake, shake) : 0, sy = shake ? rand(-shake, shake) : 0;
  c.translate(W / 2 + sx, H / 2 + sy); c.scale(cam.z, cam.z); c.translate(-cam.x, -cam.y);
  drawStage(frame);
  drawEnts();
  for (const f of F) drawFighter(f);
  drawParts();
  c.restore();
  if (flashScreen > 0) { c.fillStyle = `rgba(255,255,255,${flashScreen / 16})`; c.fillRect(0, 0, W, H); }
  drawOffscreen();
  drawHUD();
  if (scene === 'countdown') {
    const n = Math.ceil(countdown / 60), p = (countdown % 60) / 60;
    bigText(String(n), 330, 150 + p * 60, '#ffd23f', clamp(p * 2, 0, 1));
  }
  if (goT > 0) bigText('LOS!', 330, 170, '#ff3b6b', clamp(goT / 20, 0, 1));
  if (cutin) drawCutin();
  if (gameOverT > 0) bigText('SPIEL!', 340, 150, '#fff', clamp((130 - gameOverT) / 10, 0, 1), '#c0122f');
  if (paused) {
    c.fillStyle = 'rgba(0,0,0,0.6)'; c.fillRect(0, 0, W, H);
    bigText('PAUSE', 320, 110, '#fff');
    c.font = 'bold 20px system-ui,sans-serif'; c.fillStyle = '#ccc'; c.textAlign = 'center';
    c.fillText('ESC = weiter   ·   Q = zurück zum Titel', W / 2, 380);
  }
  if (scene === 'results') drawResults();
}

/* ---- Loop (feste 60 Schritte/s) ---- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
cv.focus();
// Für automatisierte Tests
window.__brawl = { get F() { return F; }, get scene() { return scene; }, startMatch, settings };
</script>
