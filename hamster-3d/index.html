<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hamster 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #120b1f; overflow: hidden; -webkit-text-size-adjust: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const QS = new URLSearchParams(location.search);

/* ---------- Renderer / Szene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1030');
scene.fog = new THREE.Fog('#1a1030', 9, 22);
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight('#c9b6ff', '#2a1a40', 1.1));
const key = new THREE.DirectionalLight('#fff3e0', 2.4);
key.position.set(3, 6, 4); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.radius = 4; key.shadow.bias = -0.0015; key.shadow.normalBias = 0.03;
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 });
scene.add(key);
const rim = new THREE.DirectionalLight('#a45cff', 2.2); rim.position.set(-4, 3, -4); scene.add(rim);

// Boden: Bühnenplatte mit Lichtkreis
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshStandardMaterial({ color: '#241838', roughness: 0.8 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const spot = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshBasicMaterial({ color: '#3b2760' }));
spot.rotation.x = -Math.PI / 2; spot.position.y = 0.002; scene.add(spot);

/* ---------- Toon-Materialien ---------- */
const grad = (() => { const d = new Uint8Array([90, 170, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const toon = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.65, ...extra });   // weich schattiert
const M = {
  fur: toon('#e39a4b'), furD: toon('#b8692a'), belly: toon('#fde9cc'), pink: toon('#f4a0b5'),
  cheek: toon('#f7c48e'), vest: toon('#8e44ff'), vestD: toon('#6a2fd0'),
  refl: toon('#e9eef2', { emissive: '#8890a0', emissiveIntensity: 0.35 }),
  helmet: new THREE.MeshStandardMaterial({ color: '#151517', roughness: 0.25, metalness: 0.3 }),
  eye: new THREE.MeshStandardMaterial({ color: '#0d0d0f', roughness: 0.15 }),
  white: toon('#ffffff'), whisker: new THREE.LineBasicMaterial({ color: '#5a3416' })
};

function mesh(geo, mat, pos = [0, 0, 0], scale = [1, 1, 1], rot = [0, 0, 0]) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(...pos); m.scale.set(...scale); m.rotation.set(...rot);
  m.castShadow = true; return m;   // keine Eigenschatten: Toon-Look bleibt sauber
}
const sph = (r = 1, w = 32, h = 24) => new THREE.SphereGeometry(r, w, h);

/* ---------- Der Medien Hamster ---------- */
function buildHamster() {
  const root = new THREE.Group();      // steht auf dem Boden, schaut nach +z
  const body = new THREE.Group(); root.add(body);   // wippt / kippt
  body.position.y = 0.95;

  // Rumpf = Kopf (Hamster-Blob), pummelig
  const BS = [0.82, 0.95, 0.78];
  body.add(mesh(sph(1, 40, 32), M.fur, [0, 0, 0], BS));

  // Lila Warnweste: Band um die Körpermitte, vorne offen für den Bauch
  const vest = mesh(new THREE.SphereGeometry(1.025, 40, 16, Math.PI * 0.62, Math.PI * 1.76, Math.PI * 0.42, Math.PI * 0.34), M.vest, [0, 0, 0], BS);
  body.add(vest);
  for (const [a, b] of [[0.52, 0.04], [0.65, 0.04]]) {   // Reflektorstreifen
    body.add(mesh(new THREE.SphereGeometry(1.035, 40, 4, Math.PI * 0.62, Math.PI * 1.76, Math.PI * a, Math.PI * b), M.refl, [0, 0, 0], BS));
  }
  // Bauch
  body.add(mesh(sph(1), M.belly, [0, -0.2, 0.58], [0.42, 0.46, 0.2]));

  // Helm
  const helm = new THREE.Group(); helm.position.set(0, 0.56, 0.02); helm.rotation.x = -0.12; body.add(helm);
  helm.add(mesh(new THREE.SphereGeometry(0.62, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.5), M.helmet, [0, 0, 0], [1, 0.78, 1.02]));
  helm.add(mesh(new THREE.CylinderGeometry(0.64, 0.64, 0.05, 40), M.helmet, [0, 0, 0.02], [1, 1, 1.04]));   // Rand
  helm.add(mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.05, 40, 1, false, -Math.PI / 2, Math.PI), M.helmet, [0, 0.01, 0.3], [1, 1, 1.1]));   // Schirm vorne
  helm.add(mesh(new THREE.BoxGeometry(0.08, 0.5, 0.86), M.helmet, [0, 0.12, 0], [1, 1, 1], [0, 0, 0]));       // Kamm
  helm.add(mesh(sph(0.1), M.white, [0.25, 0.36, 0.3], [0.9, 0.25, 0.6], [0.6, 0.4, 0]));                         // Glanzlicht

  // Ohren seitlich unter dem Helm
  for (const s of [-1, 1]) {
    body.add(mesh(sph(0.17), M.furD, [s * 0.6, 0.5, -0.05], [1, 1, 0.55], [0, s * 0.5, s * 0.4]));
    body.add(mesh(sph(0.1), M.pink, [s * 0.63, 0.5, 0.0], [1, 1, 0.4], [0, s * 0.5, s * 0.4]));
  }

  // Gesicht
  for (const s of [-1, 1]) {
    body.add(mesh(sph(0.1), M.eye, [s * 0.3, 0.32, 0.66]));
    body.add(mesh(sph(0.035), M.white, [s * 0.3 + 0.035, 0.36, 0.75]));
    const ch = mesh(sph(0.27), M.cheek, [s * 0.36, 0.02, 0.58], [1, 0.85, 0.75]); ch.name = 'cheek'; body.add(ch);
    body.add(mesh(sph(0.07), M.pink, [s * 0.38, 0.06, 0.8], [1, 0.6, 0.3]));   // Bäckchen-Rouge
  }
  body.add(mesh(sph(0.075), M.pink, [0, 0.14, 0.8]));                         // Nase
  body.add(mesh(new THREE.BoxGeometry(0.1, 0.1, 0.03), M.white, [0, -0.02, 0.76]));   // Zähnchen
  for (const s of [-1, 1]) for (const dy of [0.06, 0, -0.06]) {                // Schnurrhaare
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(s * 0.14, 0.12, 0.78), new THREE.Vector3(s * 0.62, 0.12 + dy * 2.2, 0.68)]);
    body.add(new THREE.Line(g, M.whisker));
  }

  // Ärmchen
  const arms = [];
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(s * 0.62, 0.0, 0.32); body.add(pivot);
    pivot.add(mesh(sph(0.16), M.furD, [s * 0.06, -0.14, 0.08], [0.8, 1.2, 0.8]));
    pivot.add(mesh(sph(0.08), M.pink, [s * 0.08, -0.3, 0.12]));
    arms.push(pivot);
  }
  // Füße (am root, damit sie am Boden bleiben)
  const feet = [];
  for (const s of [-1, 1]) {
    const ft = new THREE.Group(); ft.position.set(s * 0.34, 0, 0.12); root.add(ft);
    ft.add(mesh(sph(0.22), M.furD, [0, 0.16, -0.04], [0.9, 0.8, 0.9]));
    ft.add(mesh(sph(0.2), M.pink, [0, 0.07, 0.12], [0.8, 0.4, 1.15]));
    feet.push(ft);
  }
  // Schwänzchen
  body.add(mesh(sph(0.12), M.furD, [0, -0.55, -0.72]));

  root.userData = { body, arms, feet, cheeks: body.children.filter(c => c.name === 'cheek') };
  return root;
}

const hamster = buildHamster();
scene.add(hamster);

/* ---------- Animation ---------- */
function pose(h, mode, t) {
  const { body, arms, feet, cheeks } = h.userData;
  body.position.y = 0.95; body.rotation.set(0, 0, 0);
  arms.forEach(a => a.rotation.set(0, 0, 0));
  feet.forEach(f => { f.position.y = 0; f.position.z = 0.12; });
  cheeks.forEach(c => c.scale.setScalar(1).multiply(new THREE.Vector3(1, 0.85, 0.75)));
  if (mode === 'idle') {
    body.position.y += Math.sin(t * 3) * 0.025;
    body.scale.set(1 + Math.sin(t * 3) * 0.012, 1 - Math.sin(t * 3) * 0.012, 1);
  } else if (mode === 'run') {
    const s = Math.sin(t * 14), c = Math.cos(t * 14);
    feet[0].position.z = 0.12 + s * 0.32; feet[0].position.y = Math.max(0, c) * 0.18;
    feet[1].position.z = 0.12 - s * 0.32; feet[1].position.y = Math.max(0, -c) * 0.18;
    body.position.y += Math.abs(s) * 0.08; body.rotation.x = 0.2; body.rotation.z = s * 0.05;
    arms[0].rotation.x = -s * 0.9; arms[1].rotation.x = s * 0.9;
  } else if (mode === 'punch') {
    body.rotation.x = 0.18; body.rotation.y = -0.35;
    arms[1].rotation.x = -1.5; arms[1].position.z = 0.6;
    arms[0].rotation.x = 0.5;
    cheeks.forEach(c => c.scale.multiplyScalar(1.15));
  }
}

/* ---------- Kamera / Loop ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let mode = QS.get('pose') || 'idle', angle = QS.has('angle') ? +QS.get('angle') : 0.5, auto = !QS.has('angle');
let drag = null;
addEventListener('pointerdown', e => { drag = e.clientX; auto = false; });
addEventListener('pointermove', e => { if (drag !== null) { angle -= (e.clientX - drag) * 0.01; drag = e.clientX; } });
addEventListener('pointerup', () => drag = null);
addEventListener('dblclick', () => { mode = { idle: 'run', run: 'punch', punch: 'idle' }[mode]; });

window.__render = (t) => {   // für Vorschau-Screenshots
  pose(hamster, mode, t);
  const r = 4.6;
  camera.position.set(Math.sin(angle) * r, 1.9, Math.cos(angle) * r);
  camera.lookAt(0, 0.95, 0);
  renderer.render(scene, camera);
};
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (auto) angle += 0.006;
  window.__render(t);
});
</script>
</body>
</html>
