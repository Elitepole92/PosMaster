<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
html,body{-webkit-text-size-adjust:100%;text-size-adjust:100%;margin:0;height:100%;background:#05040b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;outline:none}
</style>

<body>
<canvas id="game" tabindex="0" aria-label="Backstage Rallye Spielfeld"></canvas>
<script>
'use strict';
/* =========================================================================
   BACKSTAGE RALLYE – Rennspiel durch die Halle
   Start auf dem Hubwagen, mit XP aufsteigen zum Stapler und Teleskopsteiger.
   Die vier Figuren (ITler, Hallenmeister, Medien Hamster, Headrigger) stammen
   aus Backstage Brawl und sind hier als Kopie enthalten.
   ========================================================================= */
const W = 1280, H = 720;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let RS = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
  RS = cv.width / W;
}
addEventListener('resize', resize); resize();
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI, TAU = PI * 2;
const QS = new URLSearchParams(location.search);
const TOUCH = QS.has('touch') || (matchMedia('(hover: none) and (pointer: coarse)').matches && ('ontouchstart' in window || navigator.maxTouchPoints > 0));

/* ---------------- Figuren (aus Backstage Brawl übernommen) ---------------- */
function E(c, x, y, rx, ry, col, rot = 0) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); c.fill(); }
function Cc(c, x, y, r, col) { E(c, x, y, r, r, col); }
function Ln(c, x1, y1, x2, y2, col, w) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function RR(c, x, y, w, h, r, col) { c.fillStyle = col; c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.fill(); }
function strokeRR(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.stroke(); }
// Text auf der Figur, der auch bei gespiegelter Figur lesbar bleibt
function txt(c, text, x, y) {
  if (c.getTransform().a < 0) { const w = c.measureText(text).width; c.save(); c.translate(x + w, y); c.scale(-1, 1); c.fillText(text, 0, 0); c.restore(); }
  else c.fillText(text, x, y);
}
function ik(ax, ay, bx, by, L1, L2, s) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 0.01;
  const maxD = L1 + L2 - 0.01;
  if (d > maxD) { bx = ax + dx / d * maxD; by = ay + dy / d * maxD; dx = bx - ax; dy = by - ay; d = maxD; }
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const mx = ax + dx * a / d, my = ay + dy * a / d;
  return { kx: mx - s * dy * h / d, ky: my + s * dx * h / d, bx, by };
}
// Warnweste auf dem Oberkörper (Koordinaten: Hüfte = 0, Schulter = -L)
function vest(c, tw, L, col, colD) {
  RR(c, -tw / 2 - 1.5, -L - 3, tw + 3, L * 0.8, 5, col);
  c.fillStyle = colD; c.fillRect(-tw / 2 - 1.5, -L - 1, 5, L * 0.78 - 2);
  for (const y of [-L * 0.55, -L * 0.36]) { RR(c, -tw / 2 - 1.5, y, tw + 3, 4, 1, '#e9eef2'); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fillRect(-tw / 2 - 1.5, y + 0.5, tw + 3, 1); }
}

/* ---------------- Kämpfer ---------------- */
// Generische Figur mit IK-Armen/-Beinen; S = Stil des Charakters
function drawHuman(c, f, A, S) {
  A = A || animInfo(f);
  const t = f.t || 0, hz = S.hunch || 0;
  const AL = S.upper + S.fore, LL = S.thigh + S.shin, k = LL / 58;
  const HIP = { x: 0, y: S.hip }, SH = { x: hz, y: S.sh };
  const restY = S.sh + AL * 0.88;
  const P = { rot: 0, bob: 0, fF: { x: 6 * k, y: 0 }, fB: { x: -6 * k, y: 0 }, hF: { x: 8 + hz, y: restY }, hB: { x: -4 + hz, y: restY }, eyes: 'open', prop: null, A, t };
  switch (A.kind) {
    case 'idle': P.bob = Math.sin(t * 0.08) * 1.2; P.hF.y += P.bob; P.hB.y += P.bob; break;
    case 'run': {
      const s = Math.sin(t * 0.34), co = Math.cos(t * 0.34);
      P.fF = { x: 15 * k * s, y: -Math.max(0, co) * 9 * k }; P.fB = { x: -15 * k * s, y: -Math.max(0, -co) * 9 * k };
      P.hF = { x: hz - 12 * s * k + 4, y: S.sh + AL * 0.72 }; P.hB = { x: hz + 12 * s * k, y: S.sh + AL * 0.72 }; P.rot = 0.1; break;
    }
    case 'air': P.fF = { x: 12 * k, y: -16 * k }; P.fB = { x: -8 * k, y: -6 * k }; P.hF = { x: hz + AL * 0.4, y: S.sh - AL * 0.15 }; P.hB = { x: hz - AL * 0.42, y: S.sh - AL * 0.1 }; break;
    case 'shield': P.fF = { x: 12 * k, y: 0 }; P.fB = { x: -12 * k, y: 0 }; P.hF = { x: hz + AL * 0.55, y: S.sh + 6 }; P.hB = { x: hz + AL * 0.45, y: S.sh + 14 }; P.bob = 3; break;
    case 'hurt': P.rot = f.rot || 0.3; P.fF = { x: 16 * k, y: -10 * k }; P.fB = { x: -10 * k, y: -2 }; P.hF = { x: hz - 14, y: S.sh - AL * 0.8 }; P.hB = { x: hz + 18, y: S.sh - AL * 0.75 }; P.eyes = 'x'; break;
    case 'steer': P.fF = { x: 8 * k, y: 0 }; P.fB = { x: -7 * k, y: 0 }; P.hF = { x: hz + AL * 0.85, y: S.sh + AL * 0.3 }; P.hB = { x: hz + AL * 0.75, y: S.sh + AL * 0.38 }; break;
    case 'drive': P.fF = { x: 24 * k, y: S.hip + 6 }; P.fB = { x: 20 * k, y: S.hip + 8 }; P.hF = { x: hz + AL * 0.8, y: S.sh + AL * 0.35 }; P.hB = { x: hz + AL * 0.7, y: S.sh + AL * 0.42 }; break;
    case 'atk': {
      const e = A.e;
      P.hF = { x: hz + lerp(8, AL * 0.98, e), y: lerp(restY, S.sh + 4, e) }; P.hB = { x: hz - 14, y: S.sh + AL * 0.6 };
      P.fF = { x: 14 * k, y: 0 }; P.fB = { x: -10 * k, y: 0 }; P.rot = 0.08 * e;
      if (S.atkPose) S.atkPose(P, e, A); break;
    }
    case 'fin': if (S.finPose) S.finPose(P, A, f); break;
  }
  if (S.basePose && (A.kind === 'idle' || A.kind === 'run' || A.kind === 'air' || A.kind === 'shield')) S.basePose(P, A, f);
  c.save();
  c.translate(0, P.bob * 0.5);
  c.translate(HIP.x, HIP.y); c.rotate(P.rot); c.translate(-HIP.x, -HIP.y);
  const leg = (foot, shade, front) => {
    const q = ik(HIP.x, HIP.y, foot.x, foot.y, S.thigh, S.shin, -1);
    Ln(c, HIP.x, HIP.y, q.kx, q.ky, shade, S.legW);
    if (S.shinCol) {   // kurze Hose: nacktes Bein + hoher Stiefel + Cargotasche
      Ln(c, q.kx, q.ky, q.bx, q.by, front ? S.shinCol : S.shinColD, S.legW * 0.62);
      if (!S.noShaft) Ln(c, lerp(q.bx, q.kx, 0.42), lerp(q.by, q.ky, 0.42), q.bx, q.by, S.boot, S.legW * 0.9);
      const mx = lerp(HIP.x, q.kx, 0.55), my = lerp(HIP.y, q.ky, 0.55);
      RR(c, mx - 3, my - 4, 8, 9, 2, front ? S.pocket : S.pantsD);
    } else Ln(c, q.kx, q.ky, q.bx, q.by, shade, S.legW * 0.92);
    if (S.kneePad) E(c, q.kx + 2, q.ky, S.legW * 0.55, S.legW * 0.62, S.kneePad);
    const a = Math.atan2(q.by - q.ky, q.bx - q.kx), bl = S.bootL;
    c.save(); c.translate(q.bx, q.by); c.rotate(a - PI / 2);
    RR(c, -bl * 0.32, -bl * 0.36, bl, bl * 0.48, 4, S.boot); RR(c, -bl * 0.32, bl * 0.06, bl, 3.2, 1.5, '#55555c');
    c.restore();
  };
  const arm = (hand, shade, front) => {
    const q = ik(SH.x, SH.y, hand.x, hand.y, S.upper, S.fore, 1);
    Ln(c, SH.x, SH.y, q.kx, q.ky, shade, S.armW); Ln(c, q.kx, q.ky, q.bx, q.by, S.foreCol ? (front ? S.foreCol : S.foreColD) : shade, S.armW * 0.9);
    Cc(c, q.bx, q.by, S.handR, S.hand); return q;
  };
  leg(P.fB, S.pantsD, false);
  P.qB = arm(P.hB, S.sleeveD, false);
  if (S.backProp) S.backProp(c, P.qB, f, A, P);
  const vx = SH.x - HIP.x, vy = SH.y - HIP.y, L = Math.hypot(vx, vy);
  c.save(); c.translate(HIP.x, HIP.y); c.rotate(Math.atan2(vy, vx) + PI / 2);
  RR(c, -S.torsoW / 2, -L - 5, S.torsoW, L + 9, S.torsoW * 0.3, S.shirt);
  if (S.torsoDeco) S.torsoDeco(c, S.torsoW, L, f, A);
  c.restore();
  S.head(c, SH.x + S.headOff.x, SH.y + S.headOff.y, f, A, P);
  leg(P.fF, S.pants, true);
  if (S.hipFront) S.hipFront(c, f, A, P);
  const q = arm(P.hF, S.sleeve, true);
  if (S.prop) S.prop(c, q, f, A, P);
  c.restore();
}

/* ---- Medien Hamster: pummelig, lila Warnweste, schwarzer Helm ---- */
function drawHamster(c, f, A) {
  A = A || animInfo(f);
  const t = f.t || 0;
  const fur = '#e39a4b', furD = '#b8692a', belly = '#fde9cc', pink = '#f4a0b5';
  let rot = 0, bx = -10, by = 0, fx = 10, fy = 0, ax = 15, ay = -24, cheek = 1, eyeClosed = false, bodyY = 0, cig = false, puffing = false;
  switch (A.kind) {
    case 'idle': bodyY = Math.sin(t * 0.12) * 1.3; break;
    case 'run': {
      const s = Math.sin(t * 0.45), co = Math.cos(t * 0.45);
      fx = 10 + s * 9; fy = -Math.max(0, co) * 7; bx = -10 - s * 9; by = -Math.max(0, -co) * 7; rot = 0.12; bodyY = -Math.abs(s) * 2;
      ax = 17 + s * 4; ay = -30; break;
    }
    case 'air': fx = 9; fy = -9; bx = -9; by = -5; ax = 18; ay = -44; rot = A.vy < 0 ? -0.08 : 0.08; break;
    case 'shield': ax = 22; ay = -40; cheek = 1.15; break;
    case 'hurt': rot = f.rot || -0.35; fx = 16; fy = -12; bx = -14; by = -4; eyeClosed = true; cheek = 1.25; ax = -6; ay = -54; break;
    case 'steer': ax = 24; ay = -36; break;
    case 'drive': fx = 18; fy = -6; bx = 12; by = -4; ax = 24; ay = -36; break;
    case 'atk': { const e = A.e; rot = 0.22 * e; ax = lerp(15, 34, e); ay = lerp(-24, -40, e); fx = 14; bx = -12; cheek = 1 + 0.15 * e; break; }
    case 'fin': {
      cig = true;
      if (A.t < 22) { ax = 27; ay = -40; }
      else { puffing = true; cheek = A.t < 40 ? 1.55 : 1.2; ax = 14; ay = -26; rot = 0.12; }
      break;
    }
  }
  c.save();
  c.translate(0, bodyY);
  c.translate(0, -36); c.rotate(rot); c.translate(0, 36);
  const leg = (hx, hy, x, y) => { Ln(c, hx, hy, x, y - 3, furD, 11); E(c, x + 3, y - 2, 8, 4.8, pink); };
  leg(-7, -14, bx, by);
  E(c, -23, -22, 6, 4, furD);
  Cc(c, -11, -58, 7, fur); Cc(c, -11, -58, 3.8, pink);
  E(c, 0, -36, 24, 34, fur);
  // lila Warnweste mit Reflektoren
  c.save(); c.beginPath(); c.ellipse(0, -36, 24, 34, 0, 0, TAU); c.clip();
  c.fillStyle = '#8e44ff'; c.fillRect(-34, -52, 68, 40);
  c.fillStyle = '#6a2fd0'; c.fillRect(-34, -52, 12, 40);
  for (const y of [-40, -28]) { c.fillStyle = '#e9eef2'; c.fillRect(-34, y, 68, 4.5); c.fillStyle = 'rgba(255,255,255,0.7)'; c.fillRect(-34, y + 0.6, 68, 1); }
  c.restore();
  E(c, 8, -29, 11, 18, belly);
  // schwarzer Helm
  c.fillStyle = '#151517'; c.beginPath(); c.ellipse(2, -58, 20, 14, 0, PI, TAU); c.fill();
  RR(c, -19, -60, 46, 5, 2.5, '#0b0b0d');
  c.strokeStyle = 'rgba(255,255,255,0.28)'; c.lineWidth = 2; c.beginPath(); c.ellipse(2, -58, 17, 9, 0, PI * 1.15, PI * 1.55); c.stroke();
  // Gesicht
  if (eyeClosed) { Ln(c, 11, -50, 19, -48, '#111', 2.4); Ln(c, 11, -46, 19, -48, '#111', 2.4); }
  else { Cc(c, 15, -49, 4.4, '#111'); Cc(c, 16.5, -50.5, 1.6, '#fff'); }
  E(c, 18, -37, 10 * cheek, 8 * cheek, '#f7c48e');
  E(c, 19, -38, 4, 2.5, 'rgba(255,120,140,0.35)');
  Cc(c, 28, -43, 3, pink);
  RR(c, 23, -39, 4, 5, 1, '#fff');
  c.strokeStyle = 'rgba(60,30,10,0.6)'; c.lineWidth = 1;
  for (const [x2, y2] of [[39, -46], [40, -41], [38, -37]]) { c.beginPath(); c.moveTo(26, -41); c.lineTo(x2, y2); c.stroke(); }
  if (cig) {
    Ln(c, 27, -35, 40, -33, '#f2f2f2', 3); Ln(c, 27, -35, 30, -34.5, '#d9a35b', 3);
    Cc(c, 40.5, -33, 1.9, (t >> 2) % 2 ? '#ff5a1a' : '#ffb21a');
  }
  E(c, ax, ay, 5.5, 7, furD);
  leg(7, -14, fx, fy);
  c.restore();
}

/* ---- Hallenmeister: lange graue Haare, gebückt, blauer Pulli, Blaumann ---- */
const S_HM = {
  hip: -52, sh: -86, hunch: 12, thigh: 27, shin: 26, upper: 24, fore: 22, legW: 13, armW: 10, handR: 5,
  pants: '#1f3c8a', pantsD: '#18306f', sleeve: '#2f62c0', sleeveD: '#2752a3', shirt: '#2f62c0', hand: '#e7bf9b', boot: '#2a2622', bootL: 22,
  torsoW: 30, headOff: { x: 8, y: -12 },
  torsoDeco(c, tw, L) {
    RR(c, -tw / 2, -L * 0.55, tw, L * 0.55 + 4, 4, '#1f3c8a');
    Ln(c, -tw / 2 + 5, -L * 0.55, -tw / 2 + 4, -L - 2, '#1f3c8a', 4); Ln(c, tw / 2 - 5, -L * 0.55, tw / 2 - 4, -L - 2, '#1f3c8a', 4);
    RR(c, 2, -L * 0.5, 10, 9, 2, '#18306f'); Ln(c, 8, -L * 0.5 - 5, 8, -L * 0.5 + 2, '#d33', 2);
    Cc(c, -tw / 2 + 5, -L * 0.55, 2, '#c9ccd1'); Cc(c, tw / 2 - 5, -L * 0.55, 2, '#c9ccd1');
    c.strokeStyle = 'rgba(255,255,255,0.15)'; c.lineWidth = 1.2;
    for (let y = -L + 2; y < -L * 0.58; y += 4) { c.beginPath(); c.moveTo(-tw / 2 + 2, y); c.lineTo(tw / 2 - 2, y); c.stroke(); }
  },
  head(c, hx, hy, f, A, P) {
    const skin = '#e9c3a0';
    c.fillStyle = '#b9bcc2'; c.beginPath();
    c.moveTo(hx - 3, hy - 11); c.quadraticCurveTo(hx - 22, hy - 4, hx - 19, hy + 26);
    c.lineTo(hx - 6, hy + 22); c.quadraticCurveTo(hx - 5, hy + 4, hx + 3, hy - 3); c.closePath(); c.fill();
    Cc(c, hx, hy, 11.5, skin);
    c.fillStyle = '#cdd0d6'; c.beginPath(); c.arc(hx - 1, hy - 2, 12.2, PI * 1.02, PI * 1.72); c.lineTo(hx - 1, hy - 2); c.closePath(); c.fill();
    E(c, hx - 3, hy + 1, 2.6, 3.4, '#d9ab88');
    if (P.eyes === 'x') { Ln(c, hx + 5, hy - 3, hx + 9, hy + 1, '#222', 1.5); Ln(c, hx + 9, hy - 3, hx + 5, hy + 1, '#222', 1.5); }
    else Cc(c, hx + 7.5, hy - 0.5, 1.4, '#222');
    c.strokeStyle = '#333'; c.lineWidth = 1.4; c.strokeRect(hx + 4, hy - 3.5, 7.5, 5.5); Ln(c, hx - 2, hy - 2, hx + 4, hy - 1.5, '#333', 1.1);
    Ln(c, hx + 3, hy - 6.5, hx + 11.5, hy - 6, '#e2e2e2', 2.4);
    E(c, hx + 12, hy + 1.5, 3.2, 2.6, '#dcae88');
    Ln(c, hx + 6, hy + 6.5, hx + 10, hy + 6, '#9a6a55', 1.3);
    Ln(c, hx + 2, hy + 4, hx + 4, hy + 7, 'rgba(120,80,50,0.4)', 1);
  },
  atkPose(P, e) { P.prop = 'clip'; P.hF = { x: lerp(4, 58, e), y: lerp(-112, -66, e) }; P.rot = 0.12 * e; },
  finPose(P, A) {
    P.prop = 'plug'; P.hB = { x: -4, y: -64 };
    if (A.t < 40) { const up = Math.min(1, A.t / 12); P.hF = { x: 14 + 18 * up, y: lerp(-60, -122, up) }; }
    else { P.hF = { x: 44, y: -92 }; P.rot = -0.04; }
  },
  prop(c, q, f, A, P) {
    if (P.prop === 'clip') {
      c.save(); c.translate(q.bx, q.by); c.rotate(-0.4 + (A.e || 0) * 0.6);
      RR(c, -2, -22, 17, 24, 2, '#a0743c'); RR(c, 0, -19, 13, 18, 1, '#f4f4f4');
      for (let i = 0; i < 4; i++) Ln(c, 2, -15 + i * 4, 11, -15 + i * 4, '#9aa', 1);
      RR(c, 3, -24, 9, 4, 1, '#c9ccd1'); c.restore();
    } else if (P.prop === 'plug') {
      c.strokeStyle = '#7a4a24'; c.lineWidth = 3.5; c.beginPath(); c.moveTo(q.bx, q.by);
      c.quadraticCurveTo(q.bx - 30, q.by + 40, -10, -40); c.stroke();
      c.save(); c.translate(q.bx, q.by); c.rotate(-0.3);
      RR(c, -6, -14, 14, 16, 4, '#d8322b'); RR(c, -4, -18, 10, 5, 2, '#a8211c');
      for (const x of [-2, 2, 6]) Ln(c, x, -18, x, -23, '#d9b34a', 1.6);
      c.restore();
      if ((A.t || 0) < 32) {
        c.strokeStyle = (P.t >> 1) % 2 ? '#bfe8ff' : '#5cc8ff'; c.lineWidth = 1.8;
        for (let i = 0; i < 3; i++) {
          c.beginPath(); let x = q.bx + 2, y = q.by - 22; c.moveTo(x, y);
          for (let j = 0; j < 4; j++) { x += rand(-8, 8); y -= rand(3, 8); c.lineTo(x, y); }
          c.stroke();
        }
      }
    }
  }
};
const S_RIGGER = {
  hip: -62, sh: -100, hunch: 2, thigh: 32, shin: 31, upper: 27, fore: 26, legW: 8, armW: 6, handR: 4,
  pants: '#24272d', pantsD: '#1d2025', sleeve: '#2a2d33', sleeveD: '#222428', shirt: '#2a2d33', hand: '#e6b691', boot: '#18181a', bootL: 20,
  torsoW: 17, headOff: { x: 3, y: -13 },
  torsoDeco(c, tw, L) {
    Ln(c, -tw / 2, -L * 0.15, tw / 2, -L * 0.85, '#c0392b', 3); Ln(c, -tw / 2, -L * 0.85, tw / 2, -L * 0.15, '#c0392b', 3);
  },
  head(c, hx, hy, f, A, P) {
    const skin = '#e6b691';
    RR(c, hx - 4, hy + 6, 7, 8, 2, skin);
    E(c, hx, hy, 8.5, 11, skin);

function stepRace() {

  circ(120, 600, 66, 'BREMSE', touchHeld.brake, '#ff5a4a');
  circ(1160, 600, 74, 'SPRUNG', touchHeld.jump, '#ffd23f');
  const ready = r.specCd <= 0;
  circ(1150, 470, 52, ready ? 'SPEZIAL' : '…', touchHeld.spec || (ready && (frame >> 4) % 2), ready ? L.specCol : '#6a6680');
}
function drawResult() {
  const c = ctx; uiBtns = []; resT++;
  hallBg(c, 0, 0, W, H, 600, frame * 0.6);
  c.fillStyle = 'rgba(5,4,11,0.5)'; c.fillRect(0, 0, W, H);
  const { order, best } = resultInfo, win = order[0];
  const wl = win.idx === 0 ? (mode === 1 ? 'DU GEWINNST!' : 'P1 GEWINNT!') : (win.cpu ? 'DIE CPU GEWINNT!' : 'P2 GEWINNT!');
  T(c, wl, W / 2, 110, '900 64px system-ui,sans-serif', win.idx === 0 ? '#ff5a4a' : '#3fa9ff', 'center', '#000', 10);
  order.forEach((r, i) => {
    const x = W / 2 + (i === 0 ? -250 : 250), y = 470;
    Cc(c, x, y - 230, 120, 'rgba(255,255,255,0.04)');
    E(c, x, y, 120, 12, 'rgba(0,0,0,0.5)');
    c.save(); c.translate(x - 10, y); c.scale(i === 0 ? 1 : 0.85, i === 0 ? 1 : 0.85);
    VEH_DRAW[r.lvl](c, r.ch, { t: frame, def: r.ch }, { x: 0, t: frame, specT: 0, lvl: r.lvl, boom: -0.4 }); c.restore();
    T(c, (i + 1) + '. ' + r.ch.name, x, y + 50, '900 26px system-ui,sans-serif', r.ch.color, 'center', '#000', 5);
    T(c, r.finished ? fmtTime(r.finishT) : 'nicht im Ziel', x, y + 80, '800 20px system-ui,sans-serif', '#fff');
    T(c, LV[r.lvl].name + ' · ' + r.xp + ' XP', x, y + 106, '600 16px system-ui,sans-serif', '#c9c3e6');
  });

  btn('again', W / 2 - 330, 630, 300, 60, 'NOCHMAL', '#ffd23f', 24);
  btn('menu', W / 2 + 30, 630, 300, 60, 'MENÜ', '#c9c3e6', 22);
}
function drawRotate() {
  const c = ctx; c.fillStyle = '#05040b'; c.fillRect(0, 0, W, H);
  T(c, '📱↻', W / 2, H / 2 - 20, '120px sans-serif', '#fff'); T(c, 'Bitte ins Querformat drehen', W / 2, H / 2 + 80, '800 40px system-ui,sans-serif', '#ffd23f');
}

/* ---------------- Hauptschleife ---------------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { acc -= 1000 / 60; frame++; if (scene === 'race') stepRace(); }
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  if (TOUCH && innerHeight > innerWidth) drawRotate();
  else if (scene === 'title') drawTitle();
  else if (scene === 'select') drawSelect();
  else if (scene === 'race') drawRace();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// Test-Hook für automatisierte Tests
window.__rallye = { get scene() { return scene; }, get racers() { return racers; }, startRace, sel, setMode: m => { mode = m; } };
