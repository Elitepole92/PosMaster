<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Backstage Brawl</title>
<style>
html,body{margin:0;height:100%;background:#05040b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

<body>
<canvas id="game" tabindex="0" aria-label="Backstage Brawl Spielfeld"></canvas>
<script>
'use strict';
/* =========================================================================
   BACKSTAGE BRAWL – Prügelspiel (Plattform-Fighter) hinter der Bühne
   Kämpfer: siehe ROSTER
   Steuerung pro Spieler: Laufen, Springen, Schild, Schlag, Finisher
   ========================================================================= */
const W = 1280, H = 720;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
let RS = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
  RS = cv.width / W;
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const PI = Math.PI, TAU = PI * 2;

/* ---------------- Gerät erkennen ---------------- */
const QS = new URLSearchParams(location.search);
// Touch-Gerät (iPhone, iPad, Android): Touch-Buttons, nur Einzelspieler, Querformat
const TOUCH = QS.has('touch') || (matchMedia('(hover: none) and (pointer: coarse)').matches && ('ontouchstart' in window || navigator.maxTouchPoints > 0));
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
// Beta-Version: gleiche Datei im Ordner „buehnen-brawl-beta“ – eigene Bestenliste, eigene Online-Räume,
// Statistik als Beta markiert, keine Push-Abfrage, deutliches BETA-Schild.
const BETA = /-beta\//.test(location.pathname) || QS.has('beta');
if (BETA) { document.title = 'Brawl Beta'; const m = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (m) m.content = 'Brawl Beta'; }
const isPortrait = () => TOUCH && innerHeight > innerWidth;

/* ---------------- Eingabe ---------------- */
const held = new Set(); const pressed = new Set(); const touchHeld = new Set();
const NOSCROLL = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab']);
addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;   // Texteingaben: Tasten nicht ans Spiel geben
  if (NOSCROLL.has(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  held.add(e.code); audioInit();
});
addEventListener('keyup', e => held.delete(e.code));
addEventListener('blur', () => held.clear());
addEventListener('touchend', () => audioInit(), { passive: true });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (!(e.target.closest && e.target.closest('.scrollbox'))) e.preventDefault(); }, { passive: false });   // Fenster dürfen scrollen
document.addEventListener('dblclick', e => e.preventDefault());

const CTRL = [
  { left: ['KeyA'], right: ['KeyD'], up: ['KeyW'], down: ['KeyS'], atk: ['KeyF'], fin: ['KeyG'] },
  { left: ['ArrowLeft'], right: ['ArrowRight'], up: ['ArrowUp'], down: ['ArrowDown'], atk: ['KeyK', 'Numpad1'], fin: ['KeyL', 'Numpad2'] }
];
const NOINPUT = { left: 0, right: 0, up: 0, down: 0, upP: 0, downP: 0, atk: 0, fin: 0 };
const isP = (i, k) => CTRL[i][k].some(c => pressed.has(c));
function readInput(i) {
  const c = CTRL[i], h = a => a.some(k => held.has(k) || touchHeld.has(k));
  return { left: h(c.left), right: h(c.right), up: h(c.up), down: h(c.down), upP: isP(i, 'up'), downP: isP(i, 'down'),
           atk: isP(i, 'atk'), fin: isP(i, 'fin') };
}

/* ---------------- Sound (WebAudio, synthetisch) ---------------- */
let AC = null, master = null;
function audioInit() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = settings.mute ? 0 : 0.7; master.connect(AC.destination);
      const b = AC.createBuffer(1, 1, 22050), src = AC.createBufferSource(); src.buffer = b; src.connect(AC.destination); src.start(0); // iOS entsperren
    }
    catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(freq, dur, type = 'square', vol = 0.1, slide = 0, delay = 0) {
  if (!AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function applyMute() { if (master) master.gain.value = settings.mute ? 0 : 0.7; }
let noiseBuf = null;
function noise(dur, vol, freq, ftype = 'lowpass', delay = 0) {
  if (!AC) return;
  if (!noiseBuf) {
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = ftype; f.frequency.value = freq; f.Q.value = ftype === 'bandpass' ? 4 : 0.7;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}
const sfx = {
  jump() { tone(260, 0.12, 'square', 0.04, 320); },
  swing() { noise(0.09, 0.07, 2600, 'highpass'); },
  hit(k) { noise(0.1 + k * 0.006, 0.28, 700 + k * 60); tone(150, 0.14 + k * 0.004, 'sine', 0.35, -90); if (k > 16) tone(70, 0.4, 'sawtooth', 0.12, -40); },
  block() { tone(950, 0.07, 'triangle', 0.1, -200); },
  ko() { noise(1.0, 0.45, 500); tone(90, 0.9, 'sawtooth', 0.22, -60); tone(1400, 0.5, 'sine', 0.06, -1200); },
  ready() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.14, 'square', 0.05, 0, i * 0.07)); },
  fin() { tone(220, 0.6, 'sawtooth', 0.08, 440); noise(0.5, 0.15, 3000, 'highpass'); },
  engine() { tone(70, 1.8, 'sawtooth', 0.09, 60); tone(140, 0.4, 'square', 0.04, 80); },
  beep() { tone(1050, 0.09, 'square', 0.05); },
  lighter() { noise(0.05, 0.2, 4000, 'highpass'); noise(0.3, 0.08, 900, 'bandpass', 0.06); },
  puff() { noise(0.9, 0.22, 500); },
  buzz() { tone(100, 0.5, 'sawtooth', 0.06, 20); },
  zap() { noise(0.5, 0.35, 3500, 'highpass'); tone(60, 0.5, 'sawtooth', 0.25, 30); tone(2400, 0.2, 'square', 0.05, -1800); },
  chain() { for (let i = 0; i < 5; i++) tone(rand(1800, 3200), 0.05, 'triangle', 0.05, 0, i * 0.04); },
  count() { tone(440, 0.16, 'square', 0.07); },
  go() { tone(880, 0.4, 'square', 0.07); tone(1320, 0.4, 'square', 0.04); },
  shieldBreak() { tone(1200, 0.5, 'triangle', 0.1, -1000); noise(0.3, 0.2, 2000, 'highpass'); },
  select() { tone(660, 0.06, 'square', 0.05); },
  move() { tone(520, 0.04, 'square', 0.03); },
  land() { tone(110, 0.08, 'sine', 0.14, -40); noise(0.06, 0.05, 600); },
  shield() { tone(520, 0.12, 'sine', 0.05, 260); },
  respawn() { tone(300, 0.5, 'sine', 0.06, 900); tone(600, 0.4, 'triangle', 0.03, 600, 0.1); },
  feedback() { tone(900, 0.5, 'sine', 0.07, 1500); tone(1800, 0.45, 'sine', 0.03, 1200, 0.1); },
  sonic() { noise(0.08, 0.6, 6000, 'highpass'); noise(1.4, 0.55, 220); tone(48, 1.2, 'sine', 0.6, -20); tone(95, 0.6, 'sawtooth', 0.15, -50); },
  confirm() { tone(660, 0.08, 'square', 0.06); tone(990, 0.12, 'square', 0.06, 0, 0.07); },
  pickup() { [660, 880, 1320].forEach((f, i) => tone(f, 0.1, 'square', 0.05, 0, i * 0.06)); },
  drop() { tone(1400, 0.6, 'sine', 0.04, -700); },
  kurwa() { noise(0.45, 0.25, 500, 'bandpass'); tone(180, 0.45, 'sawtooth', 0.14, -70); },
  drill() { tone(240, 0.1, 'sawtooth', 0.06, 60); noise(0.08, 0.06, 3000, 'highpass'); },
  strobe(big) { noise(0.06, big ? 0.3 : 0.15, 5000, 'highpass'); tone(big ? 90 : 1800, big ? 0.4 : 0.05, big ? 'sine' : 'square', big ? 0.4 : 0.04); },
  bonk() { tone(150, 0.12, 'sine', 0.3, -70); noise(0.06, 0.15, 500); },
  stamp() { noise(0.5, 0.5, 260); tone(70, 0.5, 'sine', 0.5, -30); },
  tick() { noise(0.03, 0.1, 6000, 'highpass'); },
  key() { tone(rand(1600, 2600), 0.03, 'square', 0.025); noise(0.02, 0.06, 5000, 'highpass'); },
  enter() { tone(600, 0.08, 'square', 0.05); tone(900, 0.12, 'square', 0.05, 0, 0.07); noise(0.35, 0.12, 2500, 'bandpass', 0.06); },
  hack() { for (let i = 0; i < 8; i++) tone(rand(200, 1800), 0.05, 'square', 0.04, 0, i * 0.04); noise(0.4, 0.2, 1200, 'bandpass'); },
  parry() { tone(1320, 0.12, 'square', 0.07); tone(1760, 0.3, 'triangle', 0.07, 0, 0.05); noise(0.12, 0.18, 4000, 'highpass'); },
  calm() { [262, 330, 392].forEach((f, i) => tone(f, 1.2, 'sine', 0.035, 0, i * 0.18)); }
};

/* ---------------- Menümusik (läuft im Menü, in der Lobby und in der Kämpferwahl) ---------------- */
const MUSIC = { on: false, next: 0, step: 0, gain: null };
const M_CH = [   // Am – F – C – G
  { b: 110, n: [440, 523.25, 659.25] }, { b: 87.31, n: [349.23, 440, 523.25] },
  { b: 130.81, n: [392, 523.25, 659.25] }, { b: 98, n: [392, 493.88, 587.33] }
];
function mNote(freq, t, dur, type, vol, cut) {
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(freq, t); f.type = 'lowpass'; f.frequency.value = cut || 2400;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(MUSIC.gain); o.start(t); o.stop(t + dur + 0.05);
}
function mNoise(t, dur, vol, freq, type) {
  if (!noiseBuf) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(MUSIC.gain); s.start(t); s.stop(t + dur + 0.02);
}
function musicStep(i, t) {
  const bar = (i >> 3) % 4, e = i % 8, ch = M_CH[bar], loop = (i >> 5) % 2;
  if (e === 0) ch.n.forEach(f => mNote(f / 2, t, 1.9, 'triangle', 0.035, 1200));                    // Pad
  if (e % 2 === 0) mNote(ch.b, t, 0.32, 'sine', 0.22, 600);                                             // Bass
  if (e === 3 || e === 7) mNote(ch.b * 2, t, 0.14, 'sine', 0.1, 600);
  const arp = [0, 1, 2, 1, 2, 0, 1, 2][e], oct = loop && e > 4 ? 2 : 1;
  mNote(ch.n[arp] * oct, t, 0.2, 'square', 0.022, 1800);                                                // Arpeggio
  if (e === 0 || e === 4) { mNote(60, t, 0.25, 'sine', 0.3, 300); }                                     // Kick
  if (e === 2 || e === 6) mNoise(t, 0.12, 0.05, 1800, 'bandpass');                                     // Snare
  mNoise(t, 0.04, e % 2 ? 0.03 : 0.018, 7000, 'highpass');                                              // Hi-Hat
}
function musicTick() {
  const want = AC && !settings.mute && !document.hidden && (scene === 'title' || scene === 'online' || scene === 'select');
  if (!want) {
    if (MUSIC.on && MUSIC.gain) { MUSIC.gain.gain.cancelScheduledValues(AC.currentTime); MUSIC.gain.gain.setTargetAtTime(0, AC.currentTime, 0.15); }
    MUSIC.on = false; return;
  }
  if (!noiseBuf) noise(0.01, 0.0001, 100);   // Rauschpuffer anlegen
  if (!MUSIC.gain) { MUSIC.gain = AC.createGain(); MUSIC.gain.gain.value = 0; MUSIC.gain.connect(master); }
  if (!MUSIC.on) {
    MUSIC.on = true; MUSIC.next = AC.currentTime + 0.08;
    MUSIC.gain.gain.cancelScheduledValues(AC.currentTime); MUSIC.gain.gain.setTargetAtTime(0.55, AC.currentTime, 0.5);
  }
  if (MUSIC.next < AC.currentTime) MUSIC.next = AC.currentTime + 0.05;
  while (MUSIC.next < AC.currentTime + 0.3) { musicStep(MUSIC.step++, MUSIC.next); MUSIC.next += 60 / 108 / 2; }
}

/* ---------------- Bühne ---------------- */
const STAGE = { x1: 240, x2: 1040, top: 560, bottom: 632 };
const PLATS = [
  { x1: 350, x2: 540, y: 430, kind: 'truss' },
  { x1: 740, x2: 930, y: 430, kind: 'truss' }
];
const BLAST = { x1: -150, x2: 1430, y1: -320, y2: 900 };

/* ---------------- Zeichen-Helfer ---------------- */
function E(c, x, y, rx, ry, col, rot = 0) { c.fillStyle = col; c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); c.fill(); }
function Cc(c, x, y, r, col) { E(c, x, y, r, r, col); }
function Ln(c, x1, y1, x2, y2, col, w) { c.strokeStyle = col; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function RR(c, x, y, w, h, r, col) { c.fillStyle = col; c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.fill(); }
function strokeRR(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h); c.stroke(); }
// Text auf der Figur, der auch bei gespiegelter Figur lesbar bleibt
function txt(c, text, x, y) {
  if (c.getTransform().a < 0) { const w = c.measureText(text).width; c.save(); c.translate(x + w, y); c.scale(-1, 1); c.fillText(text, 0, 0); c.restore(); }
  else c.fillText(text, x, y);
}
function ik(ax, ay, bx, by, L1, L2, s) {
  let dx = bx - ax, dy = by - ay, d = Math.hypot(dx, dy) || 0.01;
  const maxD = L1 + L2 - 0.01;
  if (d > maxD) { bx = ax + dx / d * maxD; by = ay + dy / d * maxD; dx = bx - ax; dy = by - ay; d = maxD; }
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const mx = ax + dx * a / d, my = ay + dy * a / d;
  return { kx: mx - s * dy * h / d, ky: my + s * dx * h / d, bx, by };
}
// Warnweste auf dem Oberkörper (Koordinaten: Hüfte = 0, Schulter = -L)
function vest(c, tw, L, col, colD) {
  RR(c, -tw / 2 - 1.5, -L - 3, tw + 3, L * 0.8, 5, col);
  c.fillStyle = colD; c.fillRect(-tw / 2 - 1.5, -L - 1, 5, L * 0.78 - 2);
  for (const y of [-L * 0.55, -L * 0.36]) { RR(c, -tw / 2 - 1.5, y, tw + 3, 4, 1, '#e9eef2'); c.fillStyle = 'rgba(255,255,255,0.6)'; c.fillRect(-tw / 2 - 1.5, y + 0.5, tw + 3, 1); }
}

/* ---------------- Kämpfer ---------------- */
// Generische Figur mit IK-Armen/-Beinen; S = Stil des Charakters
function drawHuman(c, f, A, S) {
  A = A || animInfo(f);
  const t = f.t || 0, hz = S.hunch || 0;
  const AL = S.upper + S.fore, LL = S.thigh + S.shin, k = LL / 58;
  const HIP = { x: 0, y: S.hip }, SH = { x: hz, y: S.sh };
  const restY = S.sh + AL * 0.88;
  const P = { rot: 0, bob: 0, fF: { x: 6 * k, y: 0 }, fB: { x: -6 * k, y: 0 }, hF: { x: 8 + hz, y: restY }, hB: { x: -4 + hz, y: restY }, eyes: 'open', prop: null, A, t };
  switch (A.kind) {
    case 'idle': P.bob = Math.sin(t * 0.08) * 1.2; P.hF.y += P.bob; P.hB.y += P.bob; break;
    case 'run': {
      const s = Math.sin(t * 0.34), co = Math.cos(t * 0.34);
      P.fF = { x: 15 * k * s, y: -Math.max(0, co) * 9 * k }; P.fB = { x: -15 * k * s, y: -Math.max(0, -co) * 9 * k };
      P.hF = { x: hz - 12 * s * k + 4, y: S.sh + AL * 0.72 }; P.hB = { x: hz + 12 * s * k, y: S.sh + AL * 0.72 }; P.rot = 0.1; break;
    }
    case 'air': P.fF = { x: 12 * k, y: -16 * k }; P.fB = { x: -8 * k, y: -6 * k }; P.hF = { x: hz + AL * 0.4, y: S.sh - AL * 0.15 }; P.hB = { x: hz - AL * 0.42, y: S.sh - AL * 0.1 }; break;
    case 'shield': P.fF = { x: 12 * k, y: 0 }; P.fB = { x: -12 * k, y: 0 }; P.hF = { x: hz + AL * 0.55, y: S.sh + 6 }; P.hB = { x: hz + AL * 0.45, y: S.sh + 14 }; P.bob = 3; break;
    case 'hurt': P.rot = f.rot || 0.3; P.fF = { x: 16 * k, y: -10 * k }; P.fB = { x: -10 * k, y: -2 }; P.hF = { x: hz - 14, y: S.sh - AL * 0.8 }; P.hB = { x: hz + 18, y: S.sh - AL * 0.75 }; P.eyes = 'x'; break;
    case 'drive': P.fF = { x: 24 * k, y: S.hip + 6 }; P.fB = { x: 20 * k, y: S.hip + 8 }; P.hF = { x: hz + AL * 0.8, y: S.sh + AL * 0.35 }; P.hB = { x: hz + AL * 0.7, y: S.sh + AL * 0.42 }; break;
    case 'atk': {
      const e = A.e;
      P.hF = { x: hz + lerp(8, AL * 0.98, e), y: lerp(restY, S.sh + 4, e) }; P.hB = { x: hz - 14, y: S.sh + AL * 0.6 };
      P.fF = { x: 14 * k, y: 0 }; P.fB = { x: -10 * k, y: 0 }; P.rot = 0.08 * e;
      if (S.atkPose) S.atkPose(P, e, A); break;
    }
    case 'fin': if (S.finPose) S.finPose(P, A, f); break;
  }
  if (S.basePose && (A.kind === 'idle' || A.kind === 'run' || A.kind === 'air' || A.kind === 'shield')) S.basePose(P, A, f);
  c.save();
  c.translate(0, P.bob * 0.5);
  c.translate(HIP.x, HIP.y); c.rotate(P.rot); c.translate(-HIP.x, -HIP.y);
  const leg = (foot, shade, front) => {
    const q = ik(HIP.x, HIP.y, foot.x, foot.y, S.thigh, S.shin, -1);
    Ln(c, HIP.x, HIP.y, q.kx, q.ky, shade, S.legW);
    if (S.shinCol) {   // kurze Hose: nacktes Bein + hoher Stiefel + Cargotasche
      Ln(c, q.kx, q.ky, q.bx, q.by, front ? S.shinCol : S.shinColD, S.legW * 0.62);
      if (!S.noShaft) Ln(c, lerp(q.bx, q.kx, 0.42), lerp(q.by, q.ky, 0.42), q.bx, q.by, S.boot, S.legW * 0.9);
      const mx = lerp(HIP.x, q.kx, 0.55), my = lerp(HIP.y, q.ky, 0.55);
      RR(c, mx - 3, my - 4, 8, 9, 2, front ? S.pocket : S.pantsD);
    } else Ln(c, q.kx, q.ky, q.bx, q.by, shade, S.legW * 0.92);
    if (S.kneePad) E(c, q.kx + 2, q.ky, S.legW * 0.55, S.legW * 0.62, S.kneePad);
    const a = Math.atan2(q.by - q.ky, q.bx - q.kx), bl = S.bootL;

function stepHazardEnt(e) {
  if (e.type === 'boar') {
    if (e.wait > 0) { e.wait--; return; }
    e.x += e.dir * 10; e.t++;
    if (e.t % 3 === 0) dust(e.x - e.dir * 30, e.y, 1, 'rgba(110,90,60,');
    for (const f of F) {
      if (e.hits.includes(f.idx) || !hittable(f)) continue;
      if (overlap({ x: e.x - 34, y: e.y - 42, w: 68, h: 42 }, hurtbox(f))) { e.hits.push(f.idx); popText(f.x, f.y - f.def.h - 20, 'GRUNZ!', '#ffcf70', 30, 40); applyHit(HAZ_SRC, f, HAZ.boar, e.dir, f.x, f.y - 30); }
    }
    if (e.x < STAGE.x1 - 320 || e.x > STAGE.x2 + 320) e.dead = true;
  } else if (e.type === 'pyro') {
    e.t++;
    if (e.t === 90) { sfx.puff(); shake = Math.max(shake, 8); }
    if (e.t >= 90 && e.t < 130) for (const f of F) {
      if (e.hits.includes(f.idx) || !hittable(f)) continue;
      if (Math.abs(f.x - e.x) < 34 + f.def.w / 2 && f.y > STAGE.top - 300 && f.y <= STAGE.top + 2) { e.hits.push(f.idx); popText(f.x, f.y - f.def.h - 20, 'HEISS!', '#ff7a1a', 30, 40); applyHit(HAZ_SRC, f, HAZ.pyro, Math.sign(f.x - e.x) || 1, f.x, f.y - 40); }
    }
    if (e.t > 140) e.dead = true;
  }
}

function stepCamera() {
  if (focusCam && focusCam.t > 0 && !focusCam.f.dead) {   // kurz auf den Spruch des Siegers zoomen
    focusCam.t--; const f = focusCam.f;
    cam.z = lerp(cam.z, 1.8, 0.12); cam.x = lerp(cam.x, f.x, 0.15); cam.y = lerp(cam.y, f.y - f.def.h * 0.6 - 30, 0.15);
    return;
  }
  const alive = F.filter(f => !f.dead);
  // Touch: kleiner Bildschirm – weniger Rand, näher ran, damit man die Figuren gut erkennt
  const mx = TOUCH ? 150 : 220, my = TOUCH ? 100 : 140;
  let minX = 400, maxX = 880, minY = 330, maxY = 620;
  if (alive.length) {
    minX = Math.min(...alive.map(f => f.x)) - mx; maxX = Math.max(...alive.map(f => f.x)) + mx;
    minY = Math.min(...alive.map(f => f.y - f.def.h)) - my; maxY = Math.max(...alive.map(f => f.y)) + (TOUCH ? 120 : 110);
  }
  if (TOUCH) { const cx = (minX + maxX) / 2; minX = Math.min(minX, cx - 230); maxX = Math.max(maxX, cx + 230); maxY = Math.max(maxY, 640); minY = Math.min(minY, 330); }
  else { minX = Math.min(minX, 380); maxX = Math.max(maxX, 900); maxY = Math.max(maxY, 650); minY = Math.min(minY, 260); }
  minX = Math.max(minX, BLAST.x1 + 40); maxX = Math.min(maxX, BLAST.x2 - 40);
  minY = Math.max(minY, BLAST.y1 + 40); maxY = Math.min(maxY, BLAST.y2 - 20);
  const z = clamp(Math.min(W / (maxX - minX), (H - 120) / (maxY - minY)), TOUCH ? 0.72 : 0.62, TOUCH ? 1.55 : 1.2);
  cam.z = lerp(cam.z, z, 0.06);
  cam.x = lerp(cam.x, (minX + maxX) / 2, 0.08);
  cam.y = lerp(cam.y, (minY + maxY) / 2 + 40 / cam.z, 0.08);
}

// Auf der Startseite laufen ab und zu einzelne Kämpfer durchs Bild – mal gemütlich, mal mit Sprung, Spruch oder Stapler
const walkers = []; let walkT = 40;
function stepWalkers() {
  if (--walkT <= 0) {
    walkT = Math.floor(rand(100, 260));
    const busy = walkers.map(w => w.d.id), free = PICK().map(i => ROSTER[i]).filter(d => !busy.includes(d.id));
    if (walkers.length < 3 && free.length) {
      const d = pick(free), dir = Math.random() < 0.5 ? 1 : -1;
      let mode = pick(d.lobby ? ['walk', 'run', 'hop', 'talk', 'talk', 'talk', 'swing'] : ['walk', 'walk', 'run', 'hop', 'talk', 'talk', 'swing']);
      if (d.id === 'cemil' && Math.random() < 0.5) mode = 'drive';
      walkers.push({ d, dir, mode, x: dir > 0 ? -90 : W + 90, y: 0, vy: 0, t: rand(0, 50), st: 0, stopX: rand(320, 960), said: null });
    }
  }
  for (const w of walkers) {
    const sp = { walk: 1.7, talk: 1.7, swing: 1.9, hop: 2.4, run: 4.2, drive: 5.5 }[w.mode];
    w.t += w.mode === 'walk' || w.mode === 'talk' ? 0.55 : 1;
    if (w.y < 0 || w.vy) { w.vy += 0.55; w.y += w.vy; if (w.y >= 0) { w.y = 0; w.vy = 0; } }
    const atStop = (w.mode === 'talk' || w.mode === 'swing') && !w.st && Math.abs(w.x - w.stopX) < 4;
    if (atStop) w.st = 1;
    if (w.st > 0 && w.st < (w.mode === 'talk' ? 170 : 70)) {   // stehen bleiben: Spruch oder kurzer Luftschlag
      w.st++;
      if (w.mode === 'talk' && w.st === 10) w.said = w.d.lobby || pick(w.d.quotes);   // Startseiten-Spruch
      if (w.st === 30 || w.st === 52) w.at = 1;
      continue;
    }
    if (w.st) { w.st = -1; w.said = null; }
    w.x += w.dir * sp;
    if (w.mode === 'hop' && w.y === 0 && Math.random() < 0.025) w.vy = -10;
  }
  for (const w of walkers) if (w.at) { w.at++; if (w.at > 18) w.at = 0; }
  for (let i = walkers.length - 1; i >= 0; i--) if (walkers[i].x < -140 || walkers[i].x > W + 140) walkers.splice(i, 1);
}
function drawWalkers() {
  const c = ctx, gy = 684;
  for (const w of walkers) {
    const d = w.d, standing = w.st > 0;
    E(c, w.x, gy + 2, 30, 5, 'rgba(0,0,0,0.5)');
    c.save(); c.translate(w.x, gy + w.y); c.scale(w.dir * 0.95, 0.95);
    const f = dummy(d, { t: Math.floor(w.t), onGround: w.y === 0, vx: standing ? 0 : w.dir, vy: w.vy });
    if (w.mode === 'drive') drawForklift(c, f, { t: 40 });
    else d.draw(c, f, w.at ? { kind: 'atk', e: Math.sin(w.at / 18 * PI) } : w.y < 0 ? { kind: 'air', vy: w.vy } : standing ? { kind: 'idle' } : { kind: 'run' });

}

function step() {
  frame++;
  musicTick();
  if (toast && --toast.t <= 0) toast = null;
  if (NET.open) {
    if (frame % 60 === 0) netSend({ t: 'ping' });
    if (performance.now() - NET.lastRx > 15000) netLost('Keine Antwort vom anderen Gerät – Verbindung getrennt.');
  }
  if (isPortrait()) { pressed.clear(); return; }   // Hochformat: Spiel hält an
  if (!touchActive() && (touchHeld.size || pointers.size || JOY.id !== null)) releaseAll();
  if (pressed.has('KeyM')) onUI('mute');
  if (scene === 'title' && pushAsk && !a2hs && !news && !HS.show && !fbOpen && !reOpen && frame > 90) openPush();   // einmal fragen
  if (howtoBox) { if (['Enter', 'Space', 'ArrowRight'].some(k => pressed.has(k))) howtoNext(); else if (pressed.has('Escape')) closeHowto(); pressed.clear(); return; }
  if (HS.entry || fbOpen || pushOpen || reOpen) { pressed.clear(); return; }   // Namens- bzw. Feedback-Eingabe offen
  if (HS.show && ['Escape', 'Enter', 'Space'].some(k => pressed.has(k))) { onUI('hsClose'); pressed.clear(); return; }
  if (scene === 'title') stepTitle();
  else if (scene === 'online') stepOnlineLobby();
  else if (scene === 'select') { if (isOnline()) stepSelectOnline(); else stepSelect(); }
  else if (scene === 'arena') stepArena();
  else if (NET.role === 'guest' && isOnline()) guestStep();
  else if (scene === 'results') {
    stepFx();
    if (pressed.has('Enter') || pressed.has('Space')) onUI('rematch');
    else if (pressed.has('Escape')) onUI('select');
    else if (pressed.has('KeyQ')) onUI('menu');
  } else {
    if (pressed.has('Escape') && scene === 'fight' && !gameOverT) { if (isOnline()) NET.leaveAsk = !NET.leaveAsk; else { paused = !paused; sfx.select(); } }
    if (paused) { if (pressed.has('KeyQ')) onUI('menu'); pressed.clear(); return; }
    if (scene === 'countdown') {
      if (countdown % 60 === 0) sfx.count();
      if (--countdown <= 0) { scene = 'fight'; goT = 50; sfx.go(); }
    }
    if (goT > 0) goT--;
    if (scene === 'fight' && !gameOverT) matchT++;
    if (cutin) { cutin.t++; if (cutin.t >= cutin.dur) cutin = null; stepCamera(); pressed.clear(); return; }
    if (freeze > 0) { freeze--; pressed.clear(); return; }
    if (F.some(f => f.fin) && frame % 2) { stepCamera(); return; }   // Zeitlupe, solange ein Finisher läuft (Tasten bleiben gemerkt)
    const fighting = scene === 'fight' && !(gameOverT && gameOverT < 100);
    const in0 = fighting ? (isOnline() ? localInput() : settings.demo ? cpuInput(F[0], F[1]) : readInput(0)) : NOINPUT;
    const in1 = fighting ? (isOnline() ? remoteInput() : isCPU() ? cpuInput(F[1], F[0]) : readInput(1)) : NOINPUT;
    if (frame % 2) { stepFighter(F[0], in0, F[1]); stepFighter(F[1], in1, F[0]); }
    else { stepFighter(F[1], in1, F[0]); stepFighter(F[0], in0, F[1]); }
    stepEnts(); if (scene === 'fight' && !gameOverT) { stepItems(); stepHazards(); } stepFx(); stepCamera();
    if (gameOverT > 0 && --gameOverT === 0) { scene = 'results'; onMatchEnd(); logMatch(); }
  }
  pressed.clear();
}

// Touch: links ein Joystick (laufen, nach oben schnippen = springen, nach unten = Schild/durchfallen),
// rechts die Tasten. Alles drückt virtuell die Tasten von P1.
const TBTN = [
  { code: 'KeyW', x: 1016, y: 640, r: 50, label: 'SPRUNG' },
  { code: 'KeyF', x: 1166, y: 602, r: 66, label: 'SCHLAG' },
  { code: 'KeyS', x: 1030, y: 516, r: 40, label: 'SCHILD' },
  { code: 'KeyG', x: 1168, y: 444, r: 60, label: 'FINISHER' }
];
const JOY = { id: null, ox: 0, oy: 0, x: 0, y: 0, R: 70, hx: 160, hy: 590 };
const pointers = new Map();
const touchActive = () => TOUCH && (scene === 'fight' || scene === 'countdown') && !paused;
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
const uiAt = p => ui.slice().reverse().find(u => p.x >= u.x && p.x <= u.x + u.w && p.y >= u.y && p.y <= u.y + u.h);
// Maus: nur Menü-Klicks (Touch läuft über die Touch-Events darunter)
cv.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;
  e.preventDefault(); audioInit(); cv.focus();
  const hit = uiAt(toCanvas(e)); if (hit) onUI(hit.id);
});
// Touch: Die gedrückten Buttons werden bei jedem Ereignis komplett aus e.touches neu bestimmt.
// Verschluckt iOS mal ein touchend, korrigiert sich das beim nächsten Ereignis – nichts bleibt hängen.
function syncTouches(list) {
  pointers.clear();
  const now = new Set(); let joyAlive = false;
  if (touchActive()) for (const t of list) {
    const p = toCanvas(t);
    if (JOY.id === t.identifier) { joyAlive = true; JOY.x = p.x; JOY.y = p.y; continue; }
    let best = null, bd = 1e9;
    for (const b of TBTN) { const d = Math.hypot(p.x - b.x, p.y - b.y); if (d < b.r * 1.3 && d < bd) { bd = d; best = b; } }
    if (best) { now.add(best.code); continue; }
    if (JOY.id === null && p.x < W * 0.55) { JOY.id = t.identifier; JOY.ox = JOY.x = p.x; JOY.oy = JOY.y = p.y; joyAlive = true; }
  }
  if (!joyAlive) JOY.id = null;
  if (JOY.id !== null) {
    let dx = JOY.x - JOY.ox, dy = JOY.y - JOY.oy; const d = Math.hypot(dx, dy);
    if (d > JOY.R) { JOY.ox = JOY.x - dx / d * JOY.R; JOY.oy = JOY.y - dy / d * JOY.R; dx = JOY.x - JOY.ox; dy = JOY.y - JOY.oy; }   // Basis wandert mit
    const nx = dx / JOY.R;
    if (nx < -0.3) now.add('KeyA'); if (nx > 0.3) now.add('KeyD');   // nur links/rechts – Springen und Schild über die Tasten
  }
  for (const k of now) if (!touchHeld.has(k)) pressed.add(k);
  touchHeld.clear(); for (const k of now) touchHeld.add(k);
}
cv.addEventListener('touchstart', e => {
  e.preventDefault(); audioInit();
  for (const t of e.changedTouches) { const hit = uiAt(toCanvas(t)); if (hit) onUI(hit.id); }
  syncTouches(e.touches);
}, { passive: false });
cv.addEventListener('touchmove', e => { e.preventDefault(); syncTouches(e.touches); }, { passive: false });
for (const ev of ['touchend', 'touchcancel']) cv.addEventListener(ev, e => { e.preventDefault(); syncTouches(e.touches); }, { passive: false });

    if (b.code === 'KeyS' && f && f.shieldCD > 0) { c.globalAlpha = 0.9; c.strokeStyle = '#7fd3ff'; c.lineWidth = 5; c.beginPath(); c.arc(b.x, b.y, r + 5, -PI / 2, -PI / 2 + TAU * (1 - f.shieldCD / SHIELD_CD)); c.stroke(); }
    if (fin && f && !ready) { c.globalAlpha = 0.9; c.strokeStyle = f.def.color; c.lineWidth = 6; c.beginPath(); c.arc(b.x, b.y, r + 6, -PI / 2, -PI / 2 + TAU * f.meter / 100); c.stroke(); }
    c.fillStyle = on || ready ? '#1a1024' : '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = fin ? `900 ${ready ? 19 : 15}px Impact,"Arial Black",sans-serif` : 'bold 14px system-ui,sans-serif';
    c.fillText(ready ? 'FINISHER!' : b.label, b.x, b.y + 1);
    c.textBaseline = 'alphabetic'; c.restore();
  }
}
