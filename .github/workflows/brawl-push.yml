name: Backstage Brawl – Push senden
on:
  workflow_dispatch:
    inputs:
      title:
        description: Überschrift (optional, ohne „Backstage Brawl“ – der App-Name steht schon automatisch dabei)
        required: false
        default: ''
      body:
        description: Text der Nachricht
        required: true
permissions:
  contents: read
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node .github/scripts/brawl-push.js
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.BRAWL_VAPID_PRIVATE_KEY }}
          PUSH_TITLE: ${{ inputs.title }}
          PUSH_BODY: ${{ inputs.body }}
